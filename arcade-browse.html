<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Browse every English Leap practice game by episode or by game type. Search by episode number, title, or vocabulary word.">
<title>Browse the Practice Arcade</title>
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eef3fb; --soft:#9fb1c7; --teal:#1fc4b6; --coral:#ff8a63; --pink:#f6479a; --purple:#8b6cff;
    --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.13);
    --display:'Clash Display',system-ui,sans-serif; --body:'General Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);color:var(--ink);background:
    radial-gradient(100% 60% at 20% 0%, rgba(139,108,255,.16), transparent 55%),
    radial-gradient(90% 60% at 90% 4%, rgba(31,196,182,.16), transparent 58%),
    linear-gradient(180deg,#0b1020,#0e1626) fixed;min-height:100vh;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:1040px;margin:0 auto;padding:16px 20px 70px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px;gap:12px}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--soft);font-weight:600;font-size:14px;
    background:var(--glass);border:1px solid var(--line);padding:9px 15px;border-radius:999px}
  .back:hover{color:var(--ink)}
  .acct{color:var(--soft);font-size:13px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,34px);margin:6px 0 2px;line-height:1.05}
  .sub{color:var(--soft);font-size:14.5px;margin:0 0 20px}
  .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .search{flex:1 1 240px;display:flex;align-items:center;gap:9px;background:var(--glass);border:1px solid var(--line);
    border-radius:999px;padding:10px 16px}
  .search svg{width:17px;height:17px;flex:0 0 auto;color:var(--soft)}
  .search input{flex:1;background:transparent;border:0;outline:0;color:var(--ink);font-family:var(--body);font-size:15px}
  .search input::placeholder{color:var(--soft)}
  .seg{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px;gap:3px;flex:0 0 auto}
  .seg button{font-family:var(--body);font-weight:600;font-size:13.5px;color:var(--soft);background:transparent;border:0;cursor:pointer;
    padding:8px 15px;border-radius:999px;transition:background .15s,color .15s}
  .seg button.on{color:#06121f;background:var(--teal)}
  .count{color:var(--soft);font-size:13px;margin:-6px 0 16px}
  /* episode view */
  .eplist{display:grid;grid-template-columns:1fr;gap:16px}
  .epcard{display:grid;grid-template-columns:150px 1fr;gap:0;background:var(--glass);border:1px solid var(--line);
    border-radius:20px;overflow:hidden;backdrop-filter:blur(12px);box-shadow:0 18px 50px rgba(0,0,0,.36)}
  .epcover{position:relative;aspect-ratio:16/9;background:linear-gradient(120deg,#1a1430,#241a3e);overflow:hidden;text-decoration:none;display:block}
  .epcover img{width:100%;height:100%;object-fit:cover;display:block}
  .epcover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;
    font-family:var(--display);font-weight:700;font-size:16px;color:#fff;background:linear-gradient(120deg,var(--purple),var(--teal))}
  .epcover .now{position:absolute;left:9px;bottom:9px;font-size:10px;font-weight:800;letter-spacing:.04em;color:#06121f;background:var(--teal);border-radius:999px;padding:3px 9px}
  .epbody{padding:14px 16px;min-width:0}
  .ephead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .ep{font-family:var(--display);font-weight:700;font-size:12.5px;color:var(--teal);letter-spacing:.04em}
  .eptitle{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.15;margin:0}
  .epwords{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 12px}
  .w{font-size:11.5px;color:var(--soft);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
  .epgames{display:flex;flex-wrap:wrap;gap:8px}
  .gpill{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:12.5px;font-weight:600;color:var(--ink);
    background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:7px 13px;transition:border-color .15s,transform .12s}
  .gpill:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.28)}
  .gpill .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .gpill.locked{color:var(--soft)}
  .gpill.done{border-color:rgba(31,196,182,.5)}
  .gpill .chk{color:var(--teal);font-weight:800}
  /* game view */
  .gamelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .gamecard{position:relative;display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:var(--ink);
    background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px;backdrop-filter:blur(12px);
    box-shadow:0 18px 50px rgba(0,0,0,.36);transition:transform .15s,border-color .15s}
  .gamecard:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.24)}
  .gi{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:0 0 auto;background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .gamecard h3{font-family:var(--display);font-weight:700;font-size:19px;margin:2px 0 4px}
  .gamecard p{color:var(--soft);font-size:13.5px;margin:0 0 8px;line-height:1.35}
  .cnt{color:var(--teal);font-size:13px;font-weight:600}
  .ribbon{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:3px 9px;border-radius:999px}
  .ribbon.transcript{background:rgba(139,108,255,.22);color:#c3b4ff}
  .ribbon.fluency{background:rgba(255,205,70,.22);color:#ffdd80}
  .ribbon.free{background:rgba(31,196,182,.18);color:#7fe6da}
  .note{color:var(--soft);font-size:14px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-align:center}
  .hidden{display:none!important}
  @media(max-width:480px){ .epcard{grid-template-columns:110px 1fr} }
</style>
<script src="/progress.js"></script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="/practice-arcade.html">&#8249;&nbsp;Practice Arcade</a>
    <div class="acct" id="acct"></div>
  </div>
  <h1>Browse the arcade</h1>
  <p class="sub">Find any game by episode or by game type. Search by episode number, title, or a vocabulary word.</p>

  <div class="controls">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search episodes, titles, or words…" autocomplete="off">
    </label>
    <div class="seg" id="seg">
      <button data-view="episode" class="on">By episode</button>
      <button data-view="game">By game</button>
    </div>
  </div>
  <div class="count" id="count"></div>

  <div id="episodeView" class="eplist"></div>
  <div id="gameView" class="gamelist hidden"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const CTA='https://www.patreon.com/c/englishleappracticeclub/membership';
const ORDER=['clue-room','phrase-pairs','listening-gap','story-unlock','sentence-builder'];
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let EPISODES=[], GAMES=[], view='episode';

function gamePill(g, epId){
  const label=esc(g.name||g.type);
  let done=false; try{ if(window.ELC) done=ELC.isComplete(g.type,epId); }catch(e){}
  if(g.locked){
    const tier=g.access==='transcript'?'Transcript · $1':'Fluency · $2.99';
    return `<a class="gpill locked" href="${CTA}" target="_blank" rel="noopener" title="Unlock with ${tier}">&#128274; ${label}</a>`;
  }
  return `<a class="gpill${done?' done':''}" href="/games/${esc(g.type)}/?ep=${esc(epId)}">`+
    `<span class="dot" style="background:var(--teal)"></span>${label}${done?' <span class="chk">&#10003;</span>':''}</a>`;
}
function epCard(e){
  const title=esc(e.fullTitle||e.title);
  const cover = e.cover
    ? `<img loading="lazy" src="${esc(e.cover)}" alt="${title}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'${esc(e.title)}'}))">`
    : `<div class="ph">${esc(e.title)}</div>`;
  const words=(e.words||[]).map(w=>`<span class="w">${esc(w)}</span>`).join('');
  const games=e.games.slice().sort((a,b)=>ORDER.indexOf(a.type)-ORDER.indexOf(b.type)).map(g=>gamePill(g,e.id)).join('');
  const firstType=(e.games.find(g=>!g.locked)||e.games[0]||{}).type||'clue-room';
  return `<article class="epcard" data-s="${esc((e.ep+' '+e.id+' '+(e.fullTitle||'')+' '+e.title+' '+(e.words||[]).join(' ')).toLowerCase())}">
    <a class="epcover" href="/games/${esc(firstType)}/?ep=${esc(e.id)}">${cover}${e.current?'<span class="now">THIS WEEK</span>':''}</a>
    <div class="epbody">
      <div class="ephead"><span class="ep">${esc(e.ep)}</span><h3 class="eptitle">${title}</h3></div>
      <div class="epwords">${words}</div>
      <div class="epgames">${games}</div>
    </div></article>`;
}
function gameCard(g){
  const n=(g.episodes||[]).length;
  const rib=g.access?`<span class="ribbon ${esc(g.access)}">${g.access==='free'?'Free':g.access==='transcript'?'$1':'$2.99'}</span>`:'';
  return `<a class="gamecard" href="/arcade-type.html?type=${esc(g.type)}" data-s="${esc((g.name+' '+(g.tagline||'')).toLowerCase())}">
    <span class="gi">${g.icon||'&#127918;'}</span>
    <div><h3>${esc(g.name)}</h3><p>${esc(g.tagline||'')}</p><span class="cnt">${n} ${n===1?'episode':'episodes'} &rsaquo;</span></div>${rib}</a>`;
}
function applySearch(){
  const q=($('#q').value||'').trim().toLowerCase();
  const box=view==='episode'?$('#episodeView'):$('#gameView');
  let shown=0;
  box.querySelectorAll('[data-s]').forEach(el=>{
    const hit=!q||el.getAttribute('data-s').includes(q);
    el.classList.toggle('hidden',!hit); if(hit) shown++;
  });
  const total=box.querySelectorAll('[data-s]').length;
  $('#count').textContent = q ? (shown+' of '+total+' '+(view==='episode'?'episodes':'games')+' match “'+$('#q').value.trim()+'”')
    : (view==='episode'?(total+' episodes'):(total+' game types'));
}
function setView(v){
  view=v;
  $('#episodeView').classList.toggle('hidden',v!=='episode');
  $('#gameView').classList.toggle('hidden',v!=='game');
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  applySearch();
}
async function load(){
  let data;
  try{ const r=await fetch('/api/games'); data=await r.json(); }
  catch(e){ $('#episodeView').innerHTML='<div class="note">Couldn\u2019t load the arcade. Please try again.</div>'; return; }
  if(data&&data.name) $('#acct').innerHTML='Signed in as <b style="color:var(--ink)">'+esc(data.name)+'</b>';
  GAMES=(data.arcade||[]).slice().sort((a,b)=>ORDER.indexOf(a.type)-ORDER.indexOf(b.type));
  const map=new Map();
  (data.arcade||[]).forEach(gt=>(gt.episodes||[]).forEach(e=>{
    if(!map.has(e.id)) map.set(e.id,{id:e.id,ep:e.ep,title:e.title,fullTitle:e.fullTitle,cover:e.cover,words:e.words||[],current:e.current,games:[]});
    const rec=map.get(e.id);
    rec.games.push({type:gt.type,name:gt.name,icon:gt.icon,access:gt.access,locked:gt.locked});
    if(gt.type==='clue-room'&&e.cover) rec.cover=e.cover;
    if((!rec.fullTitle||rec.fullTitle===rec.title)&&e.fullTitle) rec.fullTitle=e.fullTitle;
    if((!rec.words||!rec.words.length)&&e.words&&e.words.length) rec.words=e.words;
  }));
  EPISODES=[...map.values()];
  $('#episodeView').innerHTML = EPISODES.map(epCard).join('') || '<div class="note">No episodes yet.</div>';
  $('#gameView').innerHTML = GAMES.map(gameCard).join('') || '<div class="note">No games yet.</div>';
  setView('episode');
}
$('#q').addEventListener('input',applySearch);
document.querySelectorAll('#seg button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
load();
</script>
</body>
</html>
