<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#06060f" />
<meta name="description" content="Your English Leap Club progress — minutes practised, phrases you own, and what to work on next." />
<title>English Leap Club · Your progress</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/elc.css" />
<link rel="stylesheet" href="/theme.css" />
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:var(--body);color:var(--ink);min-height:100vh;background:var(--space);-webkit-tap-highlight-color:transparent}
  .aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen;will-change:transform}
  .b1{width:58vw;height:58vw;left:-14vw;top:-18vh;background:radial-gradient(circle at 30% 30%,var(--purple),transparent 70%);animation:drift1 28s ease-in-out infinite}
  .b2{width:52vw;height:52vw;right:-14vw;top:6vh;background:radial-gradient(circle at 60% 40%,var(--cyan),transparent 70%);animation:drift2 34s ease-in-out infinite}
  .b3{width:46vw;height:46vw;left:18vw;bottom:-24vh;background:radial-gradient(circle at 50% 50%,var(--magenta),transparent 70%);opacity:.32;animation:drift1 31s ease-in-out infinite reverse}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(5vw,4vh) scale(1.1)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-5vw,5vh) scale(1.08)}}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 80% at 50% -10%,transparent 40%,rgba(2,2,8,.55) 100%)}

  .wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:22px 20px 80px}
  a{color:var(--teal)}

  .hd{display:flex;align-items:center;justify-content:space-between;gap:14px 18px;flex-wrap:wrap;padding:18px 0 6px}
  .brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:600;font-size:var(--fs-md)}
  .brand .d{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px var(--cyan)}
  .hd-tabs{display:inline-flex;gap:2px;padding:4px;border-radius:var(--r-full);background:var(--glass2);border:1px solid var(--line)}
  .hd-tabs a{padding:8px 15px;border-radius:var(--r-full);font-family:var(--display);font-weight:600;font-size:var(--fs-sm);color:var(--soft);text-decoration:none;white-space:nowrap}
  .hd-tabs a:hover{color:var(--ink)}
  .hd-tabs a.active{background:linear-gradient(100deg,var(--teal),var(--purple));color:#fff}
  @media(max-width:560px){.hd-tabs{width:100%;justify-content:space-between}.hd-tabs a{flex:1;text-align:center}}

  h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1.1;margin:22px 0 0}
  .lede{color:var(--soft);font-size:var(--fs-md);line-height:1.55;margin:10px 0 0}

  /* Two columns on a wide screen: the page was one 860px stack, which left half a
     desktop empty and pushed "Games finished" below the fold. align-items:start so a
     short card never stretches to match a tall neighbour. */
  .pgrid{display:grid;grid-template-columns:1.65fr 1fr;gap:var(--sp-4);align-items:start;margin-top:var(--sp-4)}
  .pgrid .wide{grid-column:1/-1}
  .pcol{display:flex;flex-direction:column;gap:var(--sp-4);min-width:0}
  @media(max-width:900px){.pgrid{grid-template-columns:1fr}}

  .card{background:var(--glass2);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-6);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .card h2{font-family:var(--display);font-weight:600;font-size:var(--fs-lg);margin:0 0 4px}
  .card .sub{color:var(--soft2);font-size:var(--fs-sm);margin:0}

  /* a card folds away on a click of its heading */
  .cardhead{display:flex;align-items:flex-start;gap:var(--sp-3);width:100%;padding:0;margin:0;
    background:none;border:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
  .cardhead .ct{flex:1;min-width:0}
  .cardhead .h2{display:block;font-family:var(--display);font-weight:600;font-size:var(--fs-lg);color:var(--ink)}
  .cardhead .sub{display:block;margin-top:4px;color:var(--soft2);font-size:var(--fs-sm)}
  .cardhead .chev{width:20px;height:20px;flex:0 0 20px;margin-top:3px;color:var(--soft2);
    transition:transform .3s cubic-bezier(.4,0,.2,1),color .2s}
  .cardhead:hover .chev{color:var(--ink)}
  .card.shut .cardhead .chev{transform:rotate(-90deg)}
  .cardbody{overflow:hidden;transition:max-height .34s cubic-bezier(.4,0,.2,1),opacity .24s ease}
  /* a card that cannot fold has nothing to animate, so hiding overflow only clipped the
     selected KPI tile, which sits proud of the row by its own padding */
  .card.nofold .cardbody{overflow:visible}
  .cardinner{padding-top:var(--sp-5)}
  .card.shut .cardbody{opacity:0}
  @media (prefers-reduced-motion:reduce){.cardbody,.cardhead .chev{transition:none}}

  /* KPI row — one tile per stat. The NUMBER stays in an ink token: a coloured numeral
     loses contrast on light AND starts to read as a status ("is the red one bad?"). The
     hue lives in the emoji chip beside it, which is a fill and can carry a pillar colour
     safely on either ground. A zero is dimmed rather than shouted — four stats at full
     weight when three are 1 and one is 0 tells the member nothing. */
  .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-5) var(--sp-4)}
  @media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}}
  .kpi .k{display:flex;align-items:center;gap:var(--sp-3);min-width:0}
  .kpi .ic{width:46px;height:46px;flex:0 0 46px;border-radius:15px;display:grid;place-items:center;
    font-size:22px/* emoji glyph, not type */;line-height:1;
    background:color-mix(in srgb,var(--kc) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--kc) 38%,transparent)}
  .kpi b{display:block;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;
    color:var(--ink);font-variant-numeric:tabular-nums}
  .kpi .lbl{display:block;margin-top:3px;font-family:var(--display);font-weight:700;font-size:var(--fs-xs);
    letter-spacing:.1em;text-transform:uppercase;color:var(--soft2)}
  .kpi .k.zero .ic{opacity:.42}
  .kpi .k.zero b{color:var(--soft2)}
  /* only the tiles that lead somewhere look like they do */
  .kpi button.k{font:inherit;text-align:left;border:1px solid transparent;border-radius:var(--r-md);
    background:transparent;cursor:pointer;padding:var(--sp-2);margin:calc(var(--sp-2) * -1);
    transition:background .15s,border-color .15s,transform .15s}
  .kpi button.k:hover{background:color-mix(in srgb,var(--kc) 9%,transparent);
    border-color:color-mix(in srgb,var(--kc) 26%,transparent);transform:translateY(-1px)}
  .kpi button.k[aria-expanded="true"]{background:color-mix(in srgb,var(--kc) 13%,transparent);
    border-color:color-mix(in srgb,var(--kc) 42%,transparent)}
  .kpi button.k .ic{transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s}
  .kpi button.k:hover .ic{transform:scale(1.07) rotate(-4deg)}
  .kpi button.k[aria-expanded="true"] .ic{transform:scale(1.07);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--kc) 22%,transparent)}

  /* the drawer under the KPI row — tinted with the tile that opened it */
  .kdraw{position:relative;overflow:hidden;transition:max-height .34s cubic-bezier(.22,1,.36,1)}
  .kdraw-in{position:relative;margin-top:var(--sp-5);padding:var(--sp-5) var(--sp-5) var(--sp-4);
    border-radius:var(--r-lg);
    background:color-mix(in srgb,var(--kc) 7%,transparent);
    border:1px solid color-mix(in srgb,var(--kc) 20%,transparent);
    border-left:3px solid color-mix(in srgb,var(--kc) 55%,transparent)}
  /* A connector running from the open tile down into the panel. Chosen over a caret
     because it is OPAQUE: a translucent arrow has to match whatever the panel composites
     to over the card, which differs by theme. This just draws a line in the tile hue.
     It lives inside .kdraw-in margin, so .kdraw overflow:hidden never clips it. --cx is
     measured from the button rect in wireKpi(). */
  .kdraw-in::before{content:"";position:absolute;top:-15px;left:calc(var(--cx,50%) - 1.5px);
    width:3px;height:15px;border-radius:2px;
    background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--kc) 65%,transparent))}
  .kdraw-head{display:flex;align-items:center;gap:9px;margin:0 0 var(--sp-4)}
  .kdraw-head .ic{font-size:17px/* emoji glyph, not type */;line-height:1}
  .kdraw-head b{font-family:var(--display);font-weight:600;font-size:var(--fs-md);color:var(--ink)}
  .slist{display:flex;flex-direction:column;gap:var(--sp-3)}
  .srow{display:flex;align-items:baseline;gap:var(--sp-3);flex-wrap:wrap;font-size:var(--fs-sm)}
  .srow .when{color:var(--soft2);flex:0 0 84px;font-variant-numeric:tabular-nums}
  .srow .what{color:var(--ink);font-family:var(--display);font-weight:600;flex:1 1 200px;min-width:0}
  .srow .mins{color:var(--soft);font-variant-numeric:tabular-nums}
  .srow .ws{display:flex;flex-wrap:wrap;gap:5px;flex:1 1 100%}
  .srow .ws i{font-style:normal;font-size:var(--fs-xs);color:var(--soft);
    background:color-mix(in srgb,var(--kc) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--kc) 24%,transparent);border-radius:999px;padding:2px 8px}
  .wstrip{display:flex;gap:7px;flex-wrap:wrap}
  .wstrip i{width:26px;height:26px;border-radius:8px;display:block;background:var(--glass2);
    border:1px solid var(--line)}
  .wstrip i.on{background:linear-gradient(180deg,
    color-mix(in srgb,var(--kc) 78%,white),var(--kc));border-color:transparent}
  .wstrip i.cur{box-shadow:0 0 0 2px var(--ink)}
  .wstrip{align-items:center}
  .wstrip .ago{font-size:var(--fs-xs);color:var(--soft2);margin-right:2px}
  .kdraw .note{color:var(--soft2);font-size:var(--fs-sm);margin:var(--sp-3) 0 0}

  /* entrance, played once after the first render: cards rise in with a small stagger,
     chart columns grow from the baseline, game tracks fill. A fold never replays it. */
  @keyframes cardin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes barin{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .anim .card{animation:cardin .5s cubic-bezier(.22,1,.36,1) backwards}
  .anim .chart .bar{animation:barin .7s cubic-bezier(.22,1,.36,1) .15s backwards}
  .gt .track>i{transition:width 1s cubic-bezier(.22,1,.36,1)}
  @media (prefers-reduced-motion:reduce){
    .anim .card,.anim .chart .bar{animation:none}
    .gt .track>i{transition:none}
  }

  /* column chart */
  .chart{width:100%;height:190px;display:block;overflow:visible}
  .chart .bar{fill:var(--teal);transform-origin:50% 100%;transform-box:fill-box}
  .chart .bar.dim{fill:var(--teal);opacity:.42}
  .chart .lbl{fill:var(--soft2);font-family:var(--body);font-size:11px;text-anchor:middle}
  .chart .val{fill:var(--ink);font-family:var(--display);font-weight:700;font-size:12px;text-anchor:middle}
  .chart .base{stroke:var(--line);stroke-width:1}
  .chart .col{cursor:pointer}
  .chart .col .hit{fill:transparent}
  .chart .col:hover .bar,.chart .col:focus-visible .bar{opacity:1;filter:brightness(1.12)}
  .chart .col:hover .hit,.chart .col:focus-visible .hit{fill:color-mix(in srgb,var(--teal) 10%,transparent)}
  .chart .col:focus{outline:none}
  details.tbl{margin-top:var(--sp-4)}
  details.tbl summary{cursor:pointer;color:var(--soft2);font-family:var(--display);font-weight:600;font-size:var(--fs-sm)}
  details.tbl table{border-collapse:collapse;margin-top:10px;font-size:var(--fs-sm);color:var(--soft)}
  details.tbl th,details.tbl td{text-align:left;padding:6px 18px 6px 0;border-bottom:1px solid var(--line)}
  details.tbl th{color:var(--soft2);font-weight:600}

  /* this month's speaking allowance — the number a member actually asks for */
  .allow{margin-bottom:var(--sp-5)}
  .allow-top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);
    margin-bottom:9px}
  .allow-top b{font-family:var(--display);font-weight:700;font-size:var(--fs-lg);color:var(--ink);
    font-variant-numeric:tabular-nums}
  .allow-top span{font-size:var(--fs-sm);color:var(--soft2)}
  .allow-track{height:10px;border-radius:var(--r-full);background:var(--glass2);
    border:1px solid var(--line);overflow:hidden}
  .allow-track>i{display:block;height:100%;border-radius:var(--r-full);
    background:linear-gradient(90deg,var(--teal),var(--purple));
    transition:width 1s cubic-bezier(.22,1,.36,1)}

  /* phrase mastery */
  .ep{display:flex;align-items:center;gap:var(--sp-3);padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
  .ep:first-of-type{border-top:0}
  .ep .who{flex:1 1 210px;min-width:0}
  .ep .who b{display:block;font-family:var(--display);font-weight:600;font-size:var(--fs-sm);color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ep .who span{font-size:var(--fs-xs);color:var(--soft2)}
  .dots{display:flex;gap:7px;flex:0 0 auto}
  .dots i{width:15px;height:15px;border-radius:50%;display:block}
  .dots i.owned{background:var(--teal)}
  .dots i.started{background:transparent;box-shadow:inset 0 0 0 2px var(--gold);position:relative}
  .dots i.started::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--gold)}
  .dots i.untouched{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
  .ep.go{cursor:pointer;border-radius:var(--r-md);padding-left:var(--sp-2);padding-right:var(--sp-2);
    margin-left:calc(var(--sp-2) * -1);margin-right:calc(var(--sp-2) * -1);
    transition:background .15s}
  .ep.go:hover{background:var(--glass2)}
  .ep .chev{width:16px;height:16px;flex:0 0 16px;color:var(--soft2);transition:transform .25s}
  .ep.open .chev{transform:rotate(90deg)}
  .epwords{flex:1 1 100%;display:none;flex-wrap:wrap;gap:6px;padding:var(--sp-1) 0 var(--sp-2)}
  .ep.open .epwords{display:flex}
  .epwords i{font-style:normal;display:inline-flex;align-items:center;gap:6px;
    font-size:var(--fs-xs);color:var(--soft);border-radius:999px;padding:3px 10px 3px 7px;
    background:var(--glass2);border:1px solid var(--line)}
  .epwords i::before{content:"";width:9px;height:9px;border-radius:50%;
    box-shadow:inset 0 0 0 1.5px var(--line)}
  .epwords i.owned{color:var(--ink)}
  .epwords i.owned::before{background:var(--teal);box-shadow:none}
  .epwords i.started::before{background:var(--gold);box-shadow:none}
  .key{display:flex;flex-wrap:wrap;gap:var(--sp-4);margin-top:var(--sp-5);font-size:var(--fs-xs);color:var(--soft2)}
  .key span{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase}

  /* games */
  .gt{display:grid;grid-template-columns:auto minmax(96px,1fr) 2fr auto;align-items:center;
    gap:var(--sp-3);padding:9px var(--sp-2);margin:0 calc(var(--sp-2) * -1);
    border-radius:var(--r-md);text-decoration:none;transition:background .15s}
  a.gt:hover{background:color-mix(in srgb,var(--ga) 12%,transparent)}
  .gt .gi{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
    font-size:15px/* emoji glyph, not type */;
    background:color-mix(in srgb,var(--ga) 16%,transparent);
    border:1px solid color-mix(in srgb,var(--ga) 30%,transparent)}
  .gt .nm{font-family:var(--display);font-weight:600;font-size:var(--fs-sm);color:var(--ink)}
  .gt .track{height:9px;border-radius:var(--r-full);background:rgba(255,255,255,.08);overflow:hidden}
  .gt .track>i{display:block;height:100%;border-radius:var(--r-full);background:var(--ga,var(--purple))}
  .gt .num{font-family:var(--display);font-weight:700;font-size:var(--fs-sm);color:var(--soft)}

  /* the phrases the recommendation is actually about, so it is a thing you can picture */
  .nextwords{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--sp-4)}
  .nextwords i{font-style:normal;font-size:var(--fs-xs);font-weight:600;color:var(--ink);
    background:color-mix(in srgb,var(--gold) 20%,transparent);
    border:1px solid color-mix(in srgb,var(--gold) 34%,transparent);
    border-radius:999px;padding:3px 10px}
  .go{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:12px 22px;border-radius:var(--r-full);
    font-family:var(--display);font-weight:700;font-size:var(--fs-md);text-decoration:none;color:#fff;
    background:linear-gradient(110deg,var(--purple),var(--electric));box-shadow:0 14px 36px -14px rgba(139,108,255,.7)}
  .soon{list-style:none;margin:var(--sp-6) auto;padding:0;max-width:30em;
    display:grid;gap:var(--sp-4);text-align:left}
  .soon li{display:flex;align-items:flex-start;gap:var(--sp-3)}
  .soon .ic{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;
    font-size:18px/* emoji glyph, not type */;
    background:color-mix(in srgb,var(--kc) 16%,transparent);
    border:1px solid color-mix(in srgb,var(--kc) 30%,transparent)}
  .soon b{display:block;font-family:var(--display);font-weight:600;font-size:var(--fs-md);color:var(--ink)}
  .soon li>span>span{color:var(--soft);font-size:var(--fs-sm);line-height:1.5}
  .empty{text-align:center;padding:var(--sp-8) var(--sp-5)}
  .empty p{color:var(--soft);font-size:var(--fs-md);line-height:1.6;max-width:34em;margin:0 auto var(--sp-5)}
  .gate{text-align:center;padding:30px 26px}
  .gate h2{font-family:var(--display);margin:.5rem 0 .3rem;font-size:var(--fs-xl)}
  .gate p{color:var(--soft);font-size:var(--fs-md);line-height:1.55;max-width:34em;margin:.4rem auto}

  .foot{margin-top:42px;text-align:center;color:var(--soft2);font-size:11px;line-height:1.7}
  .tagline{font-family:var(--display);font-weight:600;font-size:var(--fs-sm)}
  .tagline .p1{color:var(--pink)}.tagline .p2{color:var(--coral)}.tagline .p3{color:var(--purple)}.tagline .p4{color:var(--teal)}
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){.blob{animation:none}}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px}
</style>
</head>
<body>
<div class="aurora"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
<div class="vignette"></div>

<div class="wrap">
  <div id="elcnav"></div>
  <script src="/elc-nav.js"></script>

  <!-- Outside #app so it is there while the dashboard loads, and on the sign-in gate too. -->
  <a class="elcback" data-smart href="/practice-arcade.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Practice Arcade</span></a>

  <div id="app" class="hidden">
    <h1 id="title">Your progress</h1>
    <p class="lede" id="lede">Everything here comes from your own practice.</p>
    <div id="body"></div>
  </div>
  <div id="gate"></div>

  <footer class="foot">
    <div class="tagline"><span class="p1">Read it.</span> <span class="p2">Hear it.</span> <span class="p3">Practise it.</span> <span class="p4">Use it.</span></div>
    <div style="margin-top:8px">&copy; 2024 Leap Labs &middot; A practice community - not a replacement for formal English education.</div>
  </footer>
</div>

<script>
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const plural=(n,one,many)=>`${n} ${n===1?one:many}`;

/* One series of monthly totals: a column chart. Bars share one colour — height carries
   the magnitude, so colour would be decoration. Only the tallest bar and the current
   month are labelled directly; the rest answer on hover. A table follows for anyone
   who cannot read the picture. */
function chart(bars){
  const W=600,H=150,PAD=26,n=bars.length;
  const max=Math.max(1,...bars.map(b=>b.minutes));
  const slot=W/n, bw=Math.min(46,slot-14);
  const tallest=bars.reduce((m,b,i)=>bars[m].minutes>=b.minutes?m:i,0);
  const cols=bars.map((b,i)=>{
    const h=b.minutes?Math.max(4,Math.round((b.minutes/max)*(H-PAD))):0;
    const x=Math.round(i*slot+(slot-bw)/2), y=H-h;
    const last=i===n-1;
    const label=(i===tallest&&b.minutes)||(last&&b.minutes);
    // a month with sessions is a way into them; an empty one is just a label
    const live=b.sessions>0;
    return `<g${live?` class="col" data-ym="${esc(b.ym)}" role="button" tabindex="0"
        aria-label="${esc(b.label)}: ${plural(b.minutes,'minute','minutes')}, ${plural(b.sessions,'session','sessions')} — show them"`:''}>
      <title>${esc(b.label)}: ${plural(b.minutes,'minute','minutes')}, ${plural(b.sessions,'session','sessions')}</title>
      ${live?`<rect class="hit" x="${Math.round(i*slot)}" y="0" width="${Math.round(slot)}" height="${H}" rx="6"></rect>`:''}
      ${h?`<rect class="bar${last?' dim':''}" x="${x}" y="${y}" width="${bw}" height="${h}" rx="4"></rect>`:''}
      ${label?`<text class="val" x="${x+bw/2}" y="${y-7}">${b.minutes}</text>`:''}
      <text class="lbl" x="${x+bw/2}" y="${H+15}">${esc(b.label)}</text>
    </g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H+22}" role="img"
     aria-label="Minutes practised each month for the last ${n} months">
     ${cols}<line class="base" x1="0" y1="${H}" x2="${W}" y2="${H}"></line></svg>
   <details class="tbl"><summary>See the numbers</summary>
     <table><thead><tr><th>Month</th><th>Minutes</th><th>Sessions</th></tr></thead><tbody>
     ${bars.map(b=>`<tr><td>${esc(b.label)}</td><td>${b.minutes}</td><td>${b.sessions}</td></tr>`).join('')}
     </tbody></table></details>`;
}

/* Which cards the member folded away, remembered per device — the same idea as the
   Arcade's browse toggle. A card they closed stays closed on the next visit. */
const SHUTKEY='elc-progress-shut';
function shutSet(){ try{ return new Set(JSON.parse(localStorage.getItem(SHUTKEY)||'[]')); }catch(e){ return new Set(); } }
function shutSave(set){ try{ localStorage.setItem(SHUTKEY,JSON.stringify([...set])); }catch(e){} }

const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" '+
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

/* A card. `key` makes the fold state stable across renders; pass fold:false for the
   ones that are the headline (the KPI row) or a single button (What next) — folding a
   card that is already one line is a control with nothing to do. */
function card(o){
  const shut=o.fold!==false && shutSet().has(o.key);
  const id='cb-'+o.key;
  const head = o.fold===false
    ? (o.title?`<div class="cardhead" style="cursor:default"><span class="ct"><span class="h2" role="heading" aria-level="2">${o.title}</span>`+
       (o.sub?`<span class="sub">${o.sub}</span>`:'')+`</span></div>`:'')
    : `<button class="cardhead" type="button" data-fold="${o.key}" aria-expanded="${!shut}" aria-controls="${id}">
         <span class="ct"><span class="h2" role="heading" aria-level="2">${o.title}</span>${o.sub?`<span class="sub">${o.sub}</span>`:''}</span>
         ${CHEV}</button>`;
  return `<section class="card${o.wide?' wide':''}${shut?' shut':''}${o.fold===false?' nofold':''}">${head}
    <div class="cardbody" id="${id}"><div class="cardinner"${head?'':' style="padding-top:0"'}>${o.body}</div></div>
  </section>`;
}

/* max-height is the only height a transition can animate here, so it is measured from
   the content and then released to `none` once the card is open — otherwise anything
   that grows inside it afterwards (the "See the numbers" table) would be clipped. */
function sync(body,open,animate){
  if(!animate){ body.style.maxHeight=open?'none':'0px'; return; }
  if(open){
    body.style.maxHeight=body.scrollHeight+'px';
    body.addEventListener('transitionend',function t(e){
      if(e.propertyName!=='max-height') return;
      body.removeEventListener('transitionend',t); body.style.maxHeight='none';
    });
  } else {
    body.style.maxHeight=body.scrollHeight+'px';   // from a real number, or it will not animate
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ body.style.maxHeight='0px'; }));
  }
}

const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;

/* Count a KPI up from zero. Eased, so it settles rather than stopping dead. Skipped for
   a zero, which has nothing to count, and for anyone who asked for less motion. */
function countUp(el){
  const to=Number(el.dataset.to)||0;
  if(REDUCED||to===0){ el.textContent=to; return; }
  const dur=800, t0=performance.now();
  el.textContent='0';
  requestAnimationFrame(function step(t){
    const p=Math.min(1,(t-t0)/dur);
    el.textContent=Math.round(to*(1-Math.pow(1-p,3)));
    if(p<1) requestAnimationFrame(step);
  });
}

/* Played once after the first render. The stagger is capped so the last card still
   arrives promptly for a member who has every one of them. */
function animateIn(){
  const body=$('#body');
  body.classList.add('anim');
  body.querySelectorAll('.card').forEach((c,i)=>{ c.style.animationDelay=Math.min(i*70,350)+'ms'; });
  body.querySelectorAll('.kpi b[data-to]').forEach(countUp);
  requestAnimationFrame(()=>{
    body.querySelectorAll('[data-w]').forEach(i=>{ i.style.width=i.dataset.w; });
  });
}

/* What each drawer shows. Built from the dashboard payload that is already in hand —
   clicking a number must not cost another request. */
const RECENT_AT_ONCE=8;

function drawerHTML(d,which,tile,ym){
  const head=(icon,title)=>`<div class="kdraw-head"><span class="ic" aria-hidden="true">${icon}</span><b>${title}</b></div>`;
  if(which==='recent'){
    const fmt=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    const all=d.recent||[];
    const list=(ym?all.filter(r=>r.ym===ym):all).slice(0,RECENT_AT_ONCE);
    const bar=ym?(d.bars||[]).find(b=>b.ym===ym):null;
    // the log keeps the last 100 sessions and we ship 24 of them, so an old busy month can
    // legitimately have counted sessions whose detail is no longer here — say so plainly
    const trimmed=bar&&bar.sessions>list.length;
    const title=ym
      ? `${esc(bar?bar.label:ym)} — ${plural(bar?bar.sessions:list.length,'recording','recordings')}`
      : `Your last ${plural(list.length,'recording','recordings')}`;
    if(!list.length) return head(tile?tile.e:'',title)+
      `<p class="note">The details for this month are no longer kept &mdash; only the totals above.</p>`;
    return head(tile?tile.e:'',title)+
      `<div class="slist">${list.map(r=>`<div class="srow">
        <span class="when">${esc(fmt(r.t))}</span>
        <span class="what">${r.n?`EP${r.n} &middot; `:''}${esc(r.title||'Practice')}</span>
        <span class="mins">${r.minutes} min${r.wpm?` &middot; ${r.wpm} wpm`:''}</span>
        ${r.words.length?`<span class="ws">${r.words.map(w=>`<i>${esc(w)}</i>`).join('')}</span>`:''}
      </div>`).join('')}</div>
      <p class="note">${trimmed?'Older details for this month have been trimmed. ':''}We keep the details, never the audio.</p>`;
  }
  // the streak as a shape: eight weeks, oldest left, this week ringed
  const wks=d.weeks||[];
  const done=wks.filter(w=>w.active).length;
  return head(tile?tile.e:'',`${plural(done,'week','weeks')} of the last ${wks.length}`)+
    `<div class="wstrip" role="img" aria-label="${done} of the last ${wks.length} weeks practised">
      <span class="ago">${wks.length}w ago</span>
      ${wks.map(w=>`<i class="${w.active?'on':''}${w.current?' cur':''}" title="${esc(w.week)}${w.active?' \u2014 practised':' \u2014 no practice'}"></i>`).join('')}
      <span class="ago">now</span>
    </div>
    <p class="note">A week counts once you practise in it &mdash; missing one is fine.</p>`;
}

/* Tiles that point at a card open it and scroll to it; tiles that own a drawer toggle it.
   Only one drawer is open at a time, and re-clicking the same tile closes it. */
// emoji + hue per drawer, so the panel can repeat the tile it belongs to
const KPIBY={recent:{e:'&#127897;&#65039;',c:'var(--coral)'},weeks:{e:'&#128293;',c:'var(--gold)'}};

// episode rows open to show their phrases; keyboard too, since they are not <button>
// a chart column opens the Recordings drawer for that month
function wireChart(){
  document.querySelectorAll('.chart .col').forEach(g=>{
    const go=()=>window.__openRecent && window.__openRecent(g.dataset.ym);
    g.addEventListener('click',go);
    g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
  });
}

function wireEpisodes(){
  document.querySelectorAll('.ep.go').forEach(row=>{
    const toggle=()=>{
      const open=row.classList.toggle('open');
      row.setAttribute('aria-expanded', open?'true':'false');
      // the card measured its height while this row was closed
      const body=row.closest('.cardbody');
      if(body && body.style.maxHeight!=='none') body.style.maxHeight='none';
    };
    row.addEventListener('click',toggle);
    row.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); }
    });
  });
}

function wireKpi(d){
  const draw=$('#kdraw'), inner=$('#kdrawIn');
  let open=null;
  // opening the drawer from somewhere other than a tile (the chart) still has to point
  // the connector at the Recordings tile, since that is what the panel belongs to
  const recentBtn=()=>document.querySelector('.kpi button.k[data-go="recent"]');
  const show=(which,btn,ym)=>{
    inner.innerHTML=drawerHTML(d,which,KPIBY[which],ym);
    inner.style.setProperty('--kc', btn?btn.style.getPropertyValue('--kc'):'var(--coral)');
    if(btn){
      const br=btn.getBoundingClientRect(), dr=inner.getBoundingClientRect();
      inner.style.setProperty('--cx', Math.round(br.left + br.width/2 - dr.left)+'px');
    }
    draw.style.maxHeight=draw.scrollHeight+'px';
    document.querySelectorAll('.kpi button.k[aria-expanded]').forEach(b=>
      b.setAttribute('aria-expanded', b===btn?'true':'false'));
  };
  window.__openRecent=(ym)=>{
    const btn=recentBtn();
    show('recent',btn,ym);
    open='recent:'+(ym||'');
    draw.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'nearest'});
  };
  const shut=()=>{
    draw.style.maxHeight=draw.scrollHeight+'px';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ draw.style.maxHeight='0px'; }));
    document.querySelectorAll('.kpi button.k[aria-expanded]').forEach(b=>b.setAttribute('aria-expanded','false'));
    open=null;
  };
  document.querySelectorAll('.kpi button.k').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const which=btn.dataset.go, cardId=btn.dataset.card;
      if(cardId){
        // open the card if the member had folded it away, then bring it into view
        const body=document.getElementById(cardId);
        const cardEl=body&&body.closest('.card');
        if(cardEl&&cardEl.classList.contains('shut')){
          const head=cardEl.querySelector('[data-fold]'); if(head) head.click();
        }
        if(cardEl) cardEl.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'center'});
        return;
      }
      if(open===which){ shut(); return; }
      show(which,btn);
      open=which;
    });
  });
}

function wireFolds(){
  document.querySelectorAll('.card .cardbody').forEach(b=>{
    sync(b,!b.parentElement.classList.contains('shut'),false);
  });
  document.querySelectorAll('[data-fold]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const cardEl=btn.closest('.card'), body=cardEl.querySelector('.cardbody');
      const open=cardEl.classList.contains('shut');
      cardEl.classList.toggle('shut',!open);
      btn.setAttribute('aria-expanded',open?'true':'false');
      sync(body,open,true);
      const set=shutSet();
      open?set.delete(btn.dataset.fold):set.add(btn.dataset.fold);
      shutSave(set);
    });
  });
  // the columns reflow at 900px, so an open card's measured height goes stale
  addEventListener('resize',()=>{
    document.querySelectorAll('.card:not(.shut) .cardbody').forEach(b=>{ b.style.maxHeight='none'; });
  },{passive:true});
}

/* Minutes used against this month's allowance. The dashboard has always returned these
   and the page never drew them — yet "how much have I got left?" is the one number a
   member asks unprompted. Works from the very first session, chart or no chart. */
function allowance(d){
  const lim=Number(d.limitMin)||0, used=Math.min(Number(d.usedMin)||0, lim);
  if(!lim) return '';
  const pct=Math.max(used>0?3:0, Math.round(used/lim*100));   // a sliver is still visible
  return `<div class="allow">
    <div class="allow-top">
      <b>${used} <span>of ${lim} minutes this month</span></b>
      <span>${lim-used} left</span>
    </div>
    <div class="allow-track"><i data-w="${pct}%" style="width:0"></i></div>
  </div>`;
}

function render(d){
  const t=d.totals;
  if(!d.hasAnything){
    // Name what will appear, rather than showing four zeros. A member who has done nothing
    // yet cannot be told how they are doing; they can be told what this page is for.
    const soon=[
      ['&#9201;&#65039;','var(--teal)','Minutes practised','Every recording you get feedback on is counted here.'],
      ['&#128142;','var(--purple)','Phrases you own','Use one naturally three times and it is yours.'],
      ['&#127918;','var(--coral)','Games finished','Across all five games, every episode in the Arcade.'],
      ['&#128293;','var(--gold)','Your streak','A week counts once you practise in it.']
    ].map(x=>`<li style="--kc:${x[1]}"><span class="ic" aria-hidden="true">${x[0]}</span>
        <span><b>${x[2]}</b><span>${x[3]}</span></span></li>`).join('');
    $('#body').innerHTML=`<div class="card empty">
      <h2>Nothing to show yet &mdash; and that is fine</h2>
      <p>Record one answer or play a game, and this page starts filling in.</p>
      <ul class="soon">${soon}</ul>
      <a class="go" href="/practice-arcade.html">&#127918; Start practising</a></div>`;
    return;
  }

  /* Colour maps to the pillar a stat belongs to, never to good/bad.
     `go` is where the tile leads. Two point at cards further down that already tell the
     story; two open a drawer. A tile whose target is not on the page for this member
     gets no `go` at all and renders as plain text — no affordance, nothing to click. */
  const hasChart=d.monthsWithData>1, hasPhrases=d.mastery.length>0;
  const hasRecent=(d.recent||[]).length>0, hasWeeks=(d.weeks||[]).some(w=>w.active);
  const kpi=[
    {v:t.minutes,      l:'minutes practised', e:'&#9201;&#65039;',            c:'var(--teal)',
     go: hasChart?{card:'cb-speaking'}:null},
    {v:t.sessions,     l:'recordings',        e:'&#127897;&#65039;',          c:'var(--coral)',
     go: hasRecent?{drawer:'recent'}:null},
    {v:t.phrasesOwned, l:'phrases owned',     e:'&#128142;',                  c:'var(--purple)',
     go: hasPhrases?{card:'cb-phrases'}:null},
    {v:d.streak,       l:'week streak',       e:'&#128293;',                  c:'var(--gold)',
     go: hasWeeks?{drawer:'weeks'}:null}
  ].map(k=>{
    const inner=`<span class="ic" aria-hidden="true">${k.e}</span>` +
      `<span><b data-to="${k.v}">${k.v}</b><span class="lbl">${esc(k.l)}</span></span>`;
    const cls=`k${k.v?'':' zero'}`;
    if(!k.go) return `<div class="${cls}" style="--kc:${k.c}">${inner}</div>`;
    const aria=k.go.drawer
      ? ` aria-expanded="false" aria-controls="kdraw"`
      : ` aria-controls="${k.go.card}"`;
    return `<button type="button" class="${cls}" style="--kc:${k.c}" data-go="${k.go.drawer||''}" `+
           `data-card="${k.go.card||''}"${aria}>${inner}</button>`;
  }).join('');

  /* Six dots say 2 of 6; they cannot say WHICH two, which is the only part a member can
     act on. The row opens to name the phrases. */
  const eps=d.mastery.map((m,i)=>`<div class="ep go" data-ep="${i}" role="button" tabindex="0" aria-expanded="false">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      <span class="who"><b>EP${m.n} &middot; ${esc(m.title)}</b>
        <span>${m.owned} owned &middot; ${m.started} started &middot; ${m.untouched} to go</span></span>
      <span class="dots" role="img" aria-label="${m.owned} of ${m.words.length} phrases owned">
        ${m.words.map(w=>`<i class="${w.state}" title="${esc(w.w)} — ${w.state}"></i>`).join('')}</span>
      <span class="epwords">${m.words.map(w=>`<i class="${w.state}">${esc(w.w)}</i>`).join('')}</span>
    </div>`).join('');

  /* A link, wearing the game's own accent and icon from the catalogue: "Sentence Builder
     0/30" should be somewhere to go, not a fact about yourself. */
  const games=(d.types||[]).map(ty=>{
    const done=(d.byType||{})[ty.type]||0, total=d.episodesTotal||1;
    // max(6px, ...) so one episode out of thirty is a bar and not an invisible sliver
    const pct=done?`max(6px, ${Math.round(done/total*100)}%)`:'0px';
    const ga=ty.accent||'var(--purple)';
    return `<a class="gt" href="/arcade-type.html?type=${encodeURIComponent(ty.type)}"
        style="--ga:${esc(ga)}" aria-label="${esc(ty.name)}: ${done} of ${total} episodes finished">
      <span class="gi" aria-hidden="true">${esc(ty.icon||'')}</span>
      <span class="nm">${esc(ty.name)}</span>
      <span class="track"><i data-w="${pct}" style="width:0"></i></span>
      <span class="num">${done}/${total}</span></a>`;
  }).join('');

  const n=d.next;
  $('#body').innerHTML=`<div class="pgrid">
    ${card({key:'kpi',fold:false,wide:true,
      body:`<div class="kpi">${kpi}</div>
        <div class="kdraw" id="kdraw" style="max-height:0"><div class="kdraw-in" id="kdrawIn"></div></div>`})}

    <div class="pcol">
    ${card({key:'speaking',title:'Speaking practice',
      sub:`Minutes analysed each month${d.pace?` &middot; you speak at about ${d.pace} words a minute`:''}`,
      body: allowance(d) + (d.monthsWithData>1 ? chart(d.bars)
        : `<p class="sub">This is your first month of recording. Come back next month and
           this becomes a trend you can watch.</p>`)})}

    ${d.mastery.length?card({key:'phrases',title:'Phrases you are building',
      sub:'Closest to yours first &mdash; a phrase is yours after three natural uses',
      body:`${eps}
        ${d.untouchedEpisodes?`<p class="sub" style="margin:var(--sp-4) 0 0">
          ${plural(d.untouchedEpisodes,'episode is','episodes are')} still untouched.</p>`:''}
        <div class="key">
          <span><i class="dots"><i class="owned" style="width:13px;height:13px;border-radius:50%;display:block"></i></i> Owned</span>
          <span><i class="dots"><i class="started" style="width:13px;height:13px;border-radius:50%;display:block"></i></i> Started</span>
          <span><i class="dots"><i class="untouched" style="width:13px;height:13px;border-radius:50%;display:block"></i></i> Not yet</span>
        </div>`}):''}
    </div>

    <div class="pcol">
    ${n?card({key:'next',fold:false,title:'&#127919; What next',sub:esc(n.why||''),
      body:`${(n.words||[]).length?`<div class="nextwords">${n.words.map(w=>`<i>${esc(w)}</i>`).join('')}</div>`:''}
        <a class="go" href="${esc(n.href||'/practice-arcade.html')}">${esc(n.cta||'Keep going')}</a>`}):''}

    ${card({key:'games',title:'Games finished',
      sub:`Across all ${d.episodesTotal} episodes in the Arcade`,body:games})}
    </div>
  </div>`;
  wireFolds();
  wireKpi(d);
  wireEpisodes();
  wireChart();
  animateIn();
}


(async()=>{
  try{
    const r=await fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'dashboard'})});
    if(r.status===401){
      $('#gate').innerHTML=`<div class="card gate"><h2>Your progress lives here</h2>
        <p>Sign in with Patreon to see your practice minutes, the phrases you own, and what to work on next.</p>
        <a class="go" style="margin-top:14px" href="/api/auth/login?next=/progress.html">Continue with Patreon</a></div>`;
      return;
    }
    if(!r.ok) throw new Error('load');
    const d=await r.json();
    $('#app').classList.remove('hidden');
    if(d.name) $('#title').textContent=`${d.name}, here is your progress`;
    ELCAccount(d.name?{name:d.name, plan:d.plan}:null,{next:'/progress.html'});
    render(d);
  }catch(e){
    $('#gate').innerHTML=`<div class="card gate"><h2>Just a moment</h2>
      <p>We could not load your progress right now. Please refresh in a little while.</p></div>`;
  }
})();
</script>
</body>
</html>
