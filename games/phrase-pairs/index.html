<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phrase Pairs — English Leap Practice Arcade</title>
<meta name="theme-color" content="#0e1a26">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<style>
  :root{
    --space:#0b1622; --ink:#eef3fb; --soft:#9fb1c7;
    --pink:#f6479a; --coral:#ff8a63; --purple:#8b6cff; --teal:#1fc4b6; --mint:#57e6c4; --amber:#ffcd46;
    --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.13);
    --display:'Clash Display',system-ui,sans-serif; --body:'General Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--body);color:var(--ink);background:var(--space);overflow-x:hidden;
    -webkit-tap-highlight-color:transparent}
  #stagebg{position:fixed;inset:0;z-index:-1;background:
    radial-gradient(110% 70% at 18% 6%, rgba(31,196,182,.20), transparent 56%),
    radial-gradient(90% 70% at 92% 4%, rgba(139,108,255,.20), transparent 58%),
    radial-gradient(90% 60% at 50% 108%, rgba(20,60,80,.5), transparent 70%),
    linear-gradient(180deg,#0b1622 0%,#0f1f2e 52%,#12263200 100%),#0b1622}
  .wrap{max-width:880px;margin:0 auto;padding:14px 18px 60px;min-height:100%}

  .bar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 2px 14px}
  .bar .left{display:flex;align-items:center;gap:12px;min-width:0}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--soft);font-weight:600;font-size:14px;
    background:var(--glass);border:1px solid var(--line);padding:8px 13px;border-radius:999px;white-space:nowrap}
  .back:hover{color:var(--ink)}
  .brand{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .dot{color:var(--teal)}
  .out{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--soft);font:inherit;font-size:13px;font-weight:600;
    padding:8px 13px;border-radius:999px;cursor:pointer}
  .out:hover{color:var(--ink)}

  .head{text-align:center;margin:6px 0 18px}
  .ep{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--teal)}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);margin:4px 0 8px;line-height:1.04}
  .sub{color:var(--soft);font-size:15px;max-width:34em;margin:0 auto;line-height:1.5}

  .stats{display:flex;gap:10px;justify-content:center;align-items:center;margin:16px 0 18px;flex-wrap:wrap}
  .stat{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-weight:600;font-size:14px;color:var(--soft)}
  .stat b{color:var(--ink);font-family:var(--display)}
  .restart{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;font-weight:600;font-size:14px;
    padding:8px 16px;border-radius:999px;cursor:pointer}
  .restart:hover{border-color:rgba(255,255,255,.3)}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:720px;margin:0 auto}
  @media(max-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:11px}}
  @media(max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}}

  .card{appearance:none;border:0;background:none;padding:0;cursor:pointer;perspective:1000px;aspect-ratio:3/4;
    border-radius:18px;outline:none}
  .card:focus-visible .inner{box-shadow:0 0 0 3px var(--teal)}
  .card .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.2,.7,.2,1);
    border-radius:18px}
  .card.up .inner,.card.matched .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:11px;overflow:hidden}
  .back{background:
      radial-gradient(120% 80% at 50% 0%, rgba(31,196,182,.22), transparent 60%),
      linear-gradient(150deg,#15273a,#1b2f48);
    border:1px solid rgba(255,255,255,.14);color:rgba(150,225,215,.85);font-size:26px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
  .front{transform:rotateY(180deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
  .front.word{background:linear-gradient(150deg,rgba(255,255,255,.24),rgba(0,0,0,.14)),var(--c);
    font-family:var(--display);font-weight:700;font-size:clamp(13px,3.3vw,18px);line-height:1.1;
    border:1px solid rgba(255,255,255,.34)}
  .front.meaning{background:linear-gradient(150deg,rgba(255,255,255,.97),rgba(228,236,248,.93));
    color:#22304a;font-family:var(--body);font-weight:600;font-size:clamp(11.5px,2.9vw,15px);line-height:1.26;
    border:1px solid rgba(255,255,255,.6)}
  .card.matched{cursor:default}
  .card.matched .front{box-shadow:0 0 0 3px var(--c),0 12px 30px -8px var(--c)}
  .card.matched .inner{animation:pop .42s ease}
  @keyframes pop{0%{transform:rotateY(180deg) scale(1)}45%{transform:rotateY(180deg) scale(1.07)}100%{transform:rotateY(180deg) scale(1)}}

  .footer{margin-top:34px;text-align:center;color:var(--soft);font-size:12px;opacity:.8}

  /* gate */
  .gateview{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;
    background:rgba(8,16,24,.86);backdrop-filter:blur(8px)}
  .gateview.show{display:flex}
  .gatecard{max-width:420px;text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:24px;
    padding:34px 28px;backdrop-filter:blur(12px)}
  .gatecard h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0 0 8px}
  .gatecard p{color:var(--soft);font-size:15px;line-height:1.55;margin:0 0 20px}
  .gatebtn{display:inline-block;text-decoration:none;color:#06121f;font-weight:700;font-size:15px;
    background:linear-gradient(135deg,var(--teal),var(--mint));padding:13px 22px;border-radius:999px}

  /* celebration */
  #fx{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;transition:opacity .3s}
  #fx.show{opacity:1}
  .nightbanner{position:fixed;left:50%;top:16%;transform:translate(-50%,-12px);z-index:55;text-align:center;
    opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;max-width:92vw;padding:6px 22px}
  .nightbanner.show{opacity:1;transform:translate(-50%,0)}
  .nightbanner .big{font-family:var(--display);font-weight:700;font-size:clamp(26px,6.4vw,38px);line-height:1.05;
    background:linear-gradient(100deg,var(--mint),var(--teal),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 18px rgba(31,196,182,.35))}
  .nightbanner .small{color:var(--ink);font-size:15px;margin-top:8px;opacity:.95}
  @media(prefers-reduced-motion:reduce){.card .inner{transition:none}.card.matched .inner{animation:none}}
</style>
<script src="/progress.js"></script>
</head>
<body>
<div id="stagebg"></div>
<div class="wrap">
  <div class="bar">
    <div class="left">
      <a class="back" href="/practice-arcade.html">&#8249;&nbsp;Arcade</a>
      <div class="brand">English Leap<span class="dot">.</span> Practice Arcade</div>
    </div>
    <div id="acct"></div>
  </div>

  <div class="head">
    <div class="ep" id="epLabel">EP232</div>
    <h1>Phrase Pairs</h1>
    <p class="sub" id="sub">Match each phrase to its meaning. Every match speaks the phrase aloud.</p>
  </div>

  <div class="stats">
    <div class="stat">Matches <b id="mMatches">0/6</b></div>
    <div class="stat">Moves <b id="mMoves">0</b></div>
    <button class="restart" id="restart">Shuffle &amp; restart</button>
  </div>

  <div class="grid" id="grid"></div>
  <div id="winExtras" style="max-width:680px;margin:0 auto"></div>

  <div class="footer">A practice community - not a replacement for formal English education.</div>
</div>

<canvas id="fx"></canvas>
<div class="nightbanner" id="nightbanner"></div>

<div class="gateview" id="gateview">
  <div class="gatecard">
    <h2 id="gateTitle">Members only</h2>
    <p id="gateMsg"></p>
    <a class="gatebtn" id="gateBtn" href="/practice-arcade.html">Go to Practice Arcade</a>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const CTA='https://www.patreon.com/c/englishleappracticeclub/membership';
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const params=new URLSearchParams(location.search);
const EP=params.get('ep')||'ep232';
const TYPE='phrase-pairs';
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---- speech (gesture-safe, en-GB) ---- */
let voices=[];
function loadVoices(){ try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];} }
loadVoices(); if(typeof speechSynthesis!=='undefined' && speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=loadVoices;
function pickVoice(){ return voices.find(v=>/en-GB/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang)) || voices[0]; }
function speak(text){ try{ if(typeof speechSynthesis==='undefined')return; const u=new SpeechSynthesisUtterance(text); const v=pickVoice(); if(v)u.voice=v; u.lang=(v&&v.lang)||'en-GB'; u.rate=.95; speechSynthesis.cancel(); speechSynthesis.resume(); speechSynthesis.speak(u);}catch(e){} }

function textOn(hex){ const h=hex.replace('#',''); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return (0.2126*r+0.7152*g+0.0722*b)/255>0.62 ? '#0f2230' : '#ffffff'; }

let DATA=null, deck=[], flipped=[], busy=false, moves=0, matched=0, total=6, keeper='';

function buildDeck(pairs){
  const cards=[];
  pairs.forEach((p,i)=>{
    cards.push({pid:i, kind:'word', text:p.word, color:p.color, speak:p.word});
    cards.push({pid:i, kind:'meaning', text:p.meaning, color:p.color, speak:p.word});
  });
  for(let i=cards.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cards[i],cards[j]]=[cards[j],cards[i]]; }
  return cards;
}
function renderDeck(){
  const grid=$('#grid'); grid.innerHTML='';
  deck.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='card'; b.dataset.idx=idx; b.type='button';
    b.setAttribute('aria-label','Card '+(idx+1));
    const front = c.kind==='word'
      ? `<div class="face front word" style="--c:${esc(c.color)};color:${textOn(c.color)}">${esc(c.text)}</div>`
      : `<div class="face front meaning">${esc(c.text)}</div>`;
    b.innerHTML=`<div class="inner"><div class="face back">&#10022;</div>${front}</div>`;
    b.addEventListener('click',()=>onFlip(idx,b));
    grid.appendChild(b);
  });
}
function start(content){
  total=content.pairs.length; keeper=content.keeper||'';
  $('#sub').textContent=content.intro||$('#sub').textContent;
  newGame();
}
function newGame(){
  deck=buildDeck(DATA.pairs); flipped=[]; busy=false; moves=0; matched=0;
  $('#mMoves').textContent='0'; $('#mMatches').textContent='0/'+total;
  const we=$('#winExtras'); if(we) we.innerHTML='';
  renderDeck();
}
function onFlip(idx,el){
  if(busy) return;
  const c=deck[idx];
  if(el.classList.contains('matched')||el.classList.contains('up')) return;
  el.classList.add('up'); flipped.push({idx,el,c});
  if(flipped.length===2){
    busy=true; moves++; $('#mMoves').textContent=moves;
    const [a,bk]=flipped;
    const isMatch = a.c.pid===bk.c.pid && a.c.kind!==bk.c.kind;
    if(isMatch){
      setTimeout(()=>{
        a.el.classList.add('matched'); bk.el.classList.add('matched');
        a.el.classList.remove('up'); bk.el.classList.remove('up');
        speak(a.c.speak);
        matched++; $('#mMatches').textContent=matched+'/'+total;
        flipped=[]; busy=false;
        if(matched===total) setTimeout(win,560);
      },260);
    } else {
      setTimeout(()=>{ a.el.classList.remove('up'); bk.el.classList.remove('up'); flipped=[]; busy=false; },760);
    }
  }
}
function win(){
  const name=(DATA.user||'').trim().split(/\s+/)[0];
  const head=name?('Brilliant, '+name+'!'):'Brilliant!';
  const line=keeper||'Six phrases — all matched. Beautiful work.';
  const nb=$('#nightbanner');
  nb.innerHTML='<div class="big">'+esc(head)+'</div><div class="small">'+esc(line)+'</div>';
  nb.classList.add('show'); setTimeout(()=>nb.classList.remove('show'),3200);
  if(!reduced) fireworks(2400);
  try{
    if(window.ELC){
      ELC.markComplete(TYPE, EP);
      const host=$('#winExtras'); if(host){ host.innerHTML='';
        const ps=(DATA.pairs||[]); const phrase=ps.length?ps[Math.floor(Math.random()*ps.length)].word:'';
        const epl=$('#epLabel').textContent||EP.toUpperCase();
        ELC.orivaCheer(host,'<b style="color:#1fc4b6">Oriva is proud of you!</b> Every phrase matched.');
      }
    }
  }catch(e){}
}
function fireworks(ms){
  const cv=$('#fx'), ctx=cv.getContext('2d');
  function size(){cv.width=innerWidth;cv.height=innerHeight;} size();
  const onR=()=>size(); addEventListener('resize',onR); cv.classList.add('show');
  const cols=['#f6479a','#ff8a63','#8b6cff','#1fc4b6','#ffcd46','#57e6c4'];
  let parts=[], end=performance.now()+ms, last=0;
  function burst(x,y){ const c=cols[(Math.random()*cols.length)|0], n=34;
    for(let i=0;i<n;i++){ const a=(Math.PI*2*i)/n+Math.random()*0.2, sp=2+Math.random()*3.4;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.1,life:1,col:c}); } }
  function frame(now){ ctx.clearRect(0,0,cv.width,cv.height);
    if(now<end && now-last>330){ last=now; burst(cv.width*(0.2+Math.random()*0.6), cv.height*(0.16+Math.random()*0.3)); }
    for(const p of parts){ p.vy+=0.05; p.x+=p.vx; p.y+=p.vy; p.vx*=0.99; p.life-=0.012;
      ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,2.6,0,7); ctx.fill(); }
    ctx.globalAlpha=1; parts=parts.filter(p=>p.life>0);
    if(now<end||parts.length) requestAnimationFrame(frame);
    else { cv.classList.remove('show'); removeEventListener('resize',onR); }
  }
  requestAnimationFrame(frame);
}
function gate(title,msg,cta){
  $('#gateTitle').textContent=title; $('#gateMsg').textContent=msg;
  const b=$('#gateBtn');
  if(cta){ b.href=cta.href; b.textContent=cta.label; if(/^https?:/.test(cta.href)){b.target='_blank';b.rel='noopener';} }
  $('#gateview').classList.add('show');
}
function acctBar(name){
  const acct=$('#acct');
  if(name){ acct.innerHTML=`<button class="out" id="signoutMenu">Sign out</button>`;
    $('#signoutMenu').onclick=async()=>{ try{await fetch('/api/auth/signout',{method:'POST'});}catch(e){} location.href='/practice-arcade.html'; };
  } else acct.innerHTML='';
}

async function load(){
  let res;
  try{ res=await fetch('/api/games?type='+encodeURIComponent(TYPE)+'&ep='+encodeURIComponent(EP)); }
  catch(e){ return gate('Connection problem','We couldn\u2019t reach the arcade. Check your connection and try again.'); }
  if(res.status===401) return gate('Members only','Sign in with Patreon from the Practice Arcade to play Phrase Pairs.',{href:'/practice-arcade.html',label:'Go to Practice Arcade'});
  if(res.status===403){
    let d={}; try{d=await res.json();}catch(e){}
    return gate('A Transcript-tier game', d.error||'Phrase Pairs is part of the Transcript tier ($1).',{href:CTA,label:'Unlock \u00b7 Transcript $1'});
  }
  if(!res.ok) return gate('Not available','This game isn\u2019t available right now. Please try again later.');
  const d=await res.json(); if(!d.ok||!d.content) return gate('Not available','This game isn\u2019t available right now.');
  DATA=Object.assign({user:d.user}, d.content);
  $('#epLabel').textContent=d.ep||EP.toUpperCase();
  acctBar(d.user);
  try{ window.ELC&&ELC.recordPlay(); }catch(e){}
  try{ window.ELC&&d.walkthrough&&ELC.howToPlay(d.walkthrough,(d.name||"")+" \u2014 how to play"); }catch(e){}
  start(d.content);
}
$('#restart').addEventListener('click',()=>{ if(DATA) newGame(); });
load();
</script>
</body>
</html>
