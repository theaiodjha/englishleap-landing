<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Phrase Pairs — match each phrase to its meaning. An English Leap practice game.">
<title>Phrase Pairs — English Leap Practice Arcade</title>
<meta name="theme-color" content="#0e1a26">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/elc.css" />
<link rel="stylesheet" href="/theme.css" />
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<style>
  :root{
    --space:#0b1622; --ink:#eef3fb; --soft:#9fb1c7; --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.13);
  }
  *{box-sizing:border-box}
  html{margin:0;height:100%}
  body{margin:0;min-height:100%}   /* min-, not fixed: the body box must grow with the page */
  body{font-family:var(--body);color:var(--ink);background:var(--space);overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;position:relative}
  #stagebg{position:absolute;inset:0;height:100%;z-index:-1;background:
    radial-gradient(110% 70% at 18% 6%, rgba(31,196,182,.20), transparent 56%),
    radial-gradient(90% 70% at 92% 4%, rgba(139,108,255,.20), transparent 58%),
    radial-gradient(90% 60% at 50% 108%, rgba(20,60,80,.5), transparent 70%),
    linear-gradient(180deg,#0b1622 0%,#0f1f2e 52%,#12263200 100%),#0b1622}
  .wrap{max-width:1100px;margin:0 auto;padding:14px 18px 60px;min-height:100%}

  .bar{display:flex;align-items:center;gap:var(--sp-3);justify-content:space-between;padding:6px 2px 14px}
  .bar .elcback{margin:0}
  .brand .dot{color:var(--teal)}

  .head{text-align:center;margin:6px 0 18px}
  .ep{font-family:var(--display);font-weight:700;font-size:var(--fs-sm);letter-spacing:.06em;color:var(--teal)}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);margin:var(--sp-1) 0 8px;line-height:1.04}
  .sub{color:var(--soft);font-size:var(--fs-md);max-width:34em;margin:0 auto;line-height:1.5}

  .stats{display:flex;gap:10px;justify-content:center;align-items:center;margin:var(--sp-4) 0 18px;flex-wrap:wrap}
  .stat{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:var(--sp-2) 15px;font-weight:600;font-size:var(--fs-md);color:var(--soft)}
  .stat b{color:var(--ink);font-family:var(--display)}
  .restart{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;font-weight:600;font-size:var(--fs-md);
    padding:var(--sp-2) 16px;border-radius:999px;cursor:pointer}
  .restart:hover{border-color:rgba(255,255,255,.3)}

  /* The board's HEIGHT follows its width (cards are aspect-ratio 3/4), so a fixed
     max-width overflowed short screens and cut the last row in half. Cap the width by
     whichever is smaller: the design width, the column, or the width implied by the
     height still available below the header. */
  .grid{--gap:14px; --rows:3; --chrome:320px;
    display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);margin:0 auto;
    width:min(720px, 100%,
      calc(((100svh - var(--chrome)) - (var(--rows) - 1) * var(--gap)) / var(--rows) * 0.75 * 4
           + (var(--rows) - 1) * var(--gap)))}
  @media(max-width:560px){ .grid{--gap:10px; --chrome:270px} }
  @media(max-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:11px}}
  @media(max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}}

  .card{appearance:none;border:0;background:none;padding:0;cursor:pointer;perspective:1000px;aspect-ratio:3/4;
    border-radius:18px;outline:none}
  .card:focus-visible .inner{box-shadow:0 0 0 3px var(--teal)}
  .card .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.2,.7,.2,1);
    border-radius:18px}
  .card.up .inner,.card.matched .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:11px;overflow:hidden}
  .face.back{background:
      radial-gradient(120% 80% at 50% 0%, rgba(31,196,182,.22), transparent 60%),
      linear-gradient(150deg,#15273a,#1b2f48);
    border:1px solid rgba(255,255,255,.14);color:rgba(150,225,215,.85);font-size:26px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
  .face.front{transform:rotateY(180deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
  .front.word{background:linear-gradient(150deg,rgba(255,255,255,.24),rgba(0,0,0,.14)),var(--c);
    font-family:var(--display);font-weight:700;font-size:clamp(13px,3.3vw,18px);line-height:1.1;
    overflow-wrap:break-word;word-break:break-word;hyphens:auto;
    border:1px solid rgba(255,255,255,.34)}
  .reviewbar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
    z-index:72;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
    background:rgba(20,14,40,.96);border:1px solid var(--line);border-radius:999px;padding:10px 12px 10px 20px;
    box-shadow:0 18px 44px rgba(0,0,0,.5);opacity:0;transition:opacity .3s,transform .3s;max-width:92vw}
  .reviewbar.show{opacity:1;transform:translate(-50%,0)}
  .reviewbar span{font-family:var(--display);font-weight:600;font-size:var(--fs-sm);color:var(--ink)}
  .reviewbar .rbtn{appearance:none;border:0;cursor:pointer;font-family:var(--display);font-weight:700;
    font-size:var(--fs-sm);min-height:40px;padding:0 18px;border-radius:999px;color:#0d1117;
    background:linear-gradient(110deg,var(--teal),var(--mint))}
  .front.meaning{background:linear-gradient(150deg,rgba(255,255,255,.97),rgba(228,236,248,.93));
    color:#22304a;font-family:var(--body);font-weight:600;font-size:clamp(11.5px,2.9vw,15px);line-height:1.26;
    overflow-wrap:break-word;hyphens:auto;
    border:1px solid rgba(255,255,255,.6)}
  /* On a match the meaning card takes a washed version of its partner's colour, so the
     pair reads as one unit. Unmatched meanings stay neutral — the tint IS the signal. */
  .card.matched .front.meaning{
    background:linear-gradient(150deg,
      color-mix(in srgb, var(--c) 26%, #ffffff),
      color-mix(in srgb, var(--c) 16%, #ffffff));
    color:#22304a;
  }
  .card.matched{cursor:default}
  .card.matched .front{box-shadow:0 0 0 3px var(--c),0 12px 30px -8px var(--c)}
  .card.matched .inner{animation:pop .42s ease}
  @keyframes pop{0%{transform:rotateY(180deg) scale(1)}45%{transform:rotateY(180deg) scale(1.07)}100%{transform:rotateY(180deg) scale(1)}}

  .footer{margin-top:34px;text-align:center;color:var(--soft);font-size:var(--fs-xs);opacity:.8}

  /* gate */
  .gateview{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:var(--sp-6);
    background:rgba(8,16,24,.86);backdrop-filter:blur(8px)}
  .gateview.show{display:flex}
  .gatecard{max-width:420px;text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:24px;
    padding:34px 28px;backdrop-filter:blur(12px)}
  .gatecard h2{font-family:var(--display);font-weight:700;font-size:var(--fs-2xl);margin:0 0 8px}
  .gatecard p{color:var(--soft);font-size:var(--fs-md);line-height:1.55;margin:0 0 20px}
  .gatebtn{display:inline-block;text-decoration:none;color:#06121f;font-weight:700;font-size:var(--fs-md);
    background:linear-gradient(135deg,var(--teal),var(--mint));padding:13px 22px;border-radius:999px}

  /* celebration */
  #fx{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;transition:opacity .3s}
  #fx.show{opacity:1}
  .nightbanner{position:fixed;left:50%;top:16%;transform:translate(-50%,-12px);z-index:55;text-align:center;
    opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;max-width:92vw;padding:6px 22px}
  .nightbanner.show{opacity:1;transform:translate(-50%,0)}
  .nightbanner .big{font-family:var(--display);font-weight:700;font-size:clamp(26px,6.4vw,38px);line-height:1.05;
    background:linear-gradient(100deg,var(--mint),var(--teal),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 18px rgba(31,196,182,.35))}
  .nightbanner .small{color:var(--ink);font-size:var(--fs-md);margin-top:var(--sp-2);opacity:.95}
  @media(prefers-reduced-motion:reduce){.card .inner{transition:none}.card.matched .inner{animation:none}}
  .gatehow{margin-top:14px;align-items:center;gap:var(--sp-2);cursor:pointer;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;font-weight:700;font-size:var(--fs-md);padding:11px 18px;border-radius:999px}
  .gatehow:hover{border-color:rgba(255,255,255,.32)}
  /* matches the counter pill, so the two read as one pair (as story-unlock) */
  .howbtn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);cursor:pointer;
    border:1px solid var(--line);background:var(--glass);color:var(--soft);font:inherit;font-weight:600;
    font-size:var(--fs-md);padding:var(--sp-2) 15px;border-radius:999px;margin:0}
  .howbtn:hover{color:var(--ink);border-color:rgba(255,255,255,.26)}
  .howbtn:hover{transform:translateY(-1px)}
  @media(max-width:380px){.wrap{padding:var(--sp-3) 12px 52px}.grid{gap:9px}.prog{gap:7px}}
  .result-card{position:relative;z-index:60;max-width:560px;margin:10px auto 0;text-align:center;
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:24px;padding:28px 22px;
    backdrop-filter:blur(10px);box-shadow:0 30px 70px -30px rgba(0,0,0,.7)}
  .result-card .rk{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,30px);color:var(--ink)}
  .result-card .rkeeper{color:var(--soft);font-size:var(--fs-md);margin-top:10px;line-height:1.5}
  .result-card .again{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--sp-3);margin-top:var(--sp-5)}
  .result-card .again a,.result-card .again button{font:inherit;font-weight:700;font-size:var(--fs-md);border-radius:999px;padding:11px 20px;cursor:pointer;text-decoration:none}
  .result-card .again .pri{background:linear-gradient(135deg,#1fc4b6,#57e6c4);color:#06201b;border:0}
  .result-card .again .sec{background:var(--glass);border:1px solid var(--line);color:var(--ink)}
  /* the game's own glyph, inline before its name — exactly as the Arcade shelf prints it
     (`${gt.icon} ${gt.name}`). em-sized so it tracks the heading's clamp. */
  .gameicon:empty{display:none}
  .gameicon{font-size:.86em/* emoji glyph, not type */;margin-right:.3em;
    line-height:1;vertical-align:baseline}
  /* Episode arrows, carousel style: fixed beside the content column, wrapping, so there
     is never a disabled end. Vertically centred, clear of the bottom-right controls. */
  .eppager a{position:fixed;top:50%;transform:translateY(-50%);z-index:30;
    display:inline-flex;align-items:center;gap:5px;
    font-family:var(--display);font-weight:700;font-size:var(--fs-sm);letter-spacing:.02em;
    text-decoration:none;color:var(--soft);padding:10px 13px;border-radius:var(--r-full);
    background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);
    transition:color .15s,border-color .15s,transform .15s}
  .eppager a:hover{color:var(--ink);border-color:color-mix(in srgb,var(--teal) 50%,transparent)}
  .eppager .p{left:max(10px,calc(50vw - 570px))}
  .eppager .n{right:max(10px,calc(50vw - 570px))}
  .eppager .p:hover{transform:translateY(-50%) translateX(-2px)}
  .eppager .n:hover{transform:translateY(-50%) translateX(2px)}
  .eppager svg{width:14px;height:14px;flex:0 0 14px}
  /* on a phone they sit on the very edge and shed the label, as carousel arrows do */
  @media(max-width:720px){
    .eppager a{padding:9px;gap:0}
    .eppager b{display:none}
  }
</style>
<script src="/progress.js"></script>
  <script src="/nav-progress.js" defer></script>

<body>
<div id="stagebg"></div>
<div class="wrap">
  <!-- for ELCAccount. Renders no header here: there is no #elcnav slot. -->
  <script src="/elc-nav.js"></script>
  <div class="bar">
    <a class="elcback" href="/arcade-type.html?type=phrase-pairs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>All episodes</span></a>
    <div class="elcnav-acct" id="acct"></div>
  </div>

  <div class="head">
    <div class="ep" id="epLabel">EP232</div>
    <h1><span class="gameicon" id="gameIcon" aria-hidden="true"></span>Phrase Pairs</h1>
    <p class="sub" id="sub">Match each phrase to its meaning. Every match speaks the phrase aloud.</p>
  </div>

  <nav class="eppager" id="epPager" aria-label="Episodes" hidden></nav>

  <div class="stats">
    <div class="stat">Matches <b id="mMatches">0/6</b></div>
    <div class="stat">Moves <b id="mMoves">0</b></div>
    <button class="restart" id="restart">Shuffle &amp; restart</button>
    <button id="howBtn" class="howbtn" style="display:none">&#9654; How to play</button>
    </div>

  <div class="grid" id="grid"></div>
  <div id="winExtras" style="max-width:680px;margin:0 auto"></div>

  <div class="footer">A practice community - not a replacement for formal English education.</div>
</div>

<canvas id="fx"></canvas>
<div class="nightbanner" id="nightbanner"></div>

<div class="gateview" id="gateview">
  <div class="gatecard">
    <h2 id="gateTitle">Members only</h2>
    <p id="gateMsg"></p>
    <a class="gatebtn" id="gateBtn" href="/practice-arcade.html">Go to Practice Arcade</a>
    <button class="gatehow" id="gateHow" style="display:none">&#9654; How to play</button>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const CTA='https://www.patreon.com/c/englishleappracticeclub/membership';
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const params=new URLSearchParams(location.search);
const EP=params.get('ep')||'ep232';
const TYPE='phrase-pairs';
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---- speech (gesture-safe, en-GB) ---- */
let voices=[];
function loadVoices(){ try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];} }
loadVoices(); if(typeof speechSynthesis!=='undefined' && speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=loadVoices;
function pickVoice(){ return voices.find(v=>/en-GB/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang)) || voices[0]; }
function speak(text){ try{ if(typeof speechSynthesis==='undefined')return; const u=new SpeechSynthesisUtterance(text); const v=pickVoice(); if(v)u.voice=v; u.lang=(v&&v.lang)||'en-GB'; u.rate=.95; speechSynthesis.cancel(); speechSynthesis.resume(); speechSynthesis.speak(u);}catch(e){} }

function textOn(hex){ const h=hex.replace('#',''); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return (0.2126*r+0.7152*g+0.0722*b)/255>0.62 ? '#0f2230' : '#ffffff'; }

let DATA=null, deck=[], flipped=[], busy=false, moves=0, matched=0, total=6, keeper='';

function buildDeck(pairs){
  const cards=[];
  pairs.forEach((p,i)=>{
    cards.push({pid:i, kind:'word', text:p.word, color:p.color, speak:p.word});
    cards.push({pid:i, kind:'meaning', text:p.meaning, color:p.color, speak:p.word});
  });
  for(let i=cards.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cards[i],cards[j]]=[cards[j],cards[i]]; }
  return cards;
}
function renderDeck(){
  const grid=$('#grid'); grid.innerHTML='';
  deck.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='card'; b.dataset.idx=idx; b.type='button';
    b.setAttribute('aria-label','Card '+(idx+1));
    const front = c.kind==='word'
      ? `<div class="face front word" style="--c:${esc(c.color)};color:${textOn(c.color)}">${esc(c.text)}</div>`
      : `<div class="face front meaning" style="--c:${esc(c.color)}">${esc(c.text)}</div>`;
    b.innerHTML=`<div class="inner"><div class="face back">&#10022;</div>${front}</div>`;
    b.addEventListener('click',()=>onFlip(idx,b));
    grid.appendChild(b);
  });
}
function start(content){
  total=content.pairs.length; keeper=content.keeper||'';
  $('#sub').textContent=content.intro||$('#sub').textContent;
  newGame();
}
function newGame(){
  deck=buildDeck(DATA.pairs); flipped=[]; busy=false; moves=0; matched=0;
  $('#mMoves').textContent='0'; $('#mMatches').textContent='0/'+total;
  const we=$('#winExtras'); if(we) we.innerHTML='';
  renderDeck();
}
function onFlip(idx,el){
  if(busy) return;
  const c=deck[idx];
  if(el.classList.contains('matched')||el.classList.contains('up')) return;
  el.classList.add('up'); flipped.push({idx,el,c});
  if(flipped.length===2){
    busy=true; moves++; $('#mMoves').textContent=moves;
    const [a,bk]=flipped;
    const isMatch = a.c.pid===bk.c.pid && a.c.kind!==bk.c.kind;
    if(isMatch){
      setTimeout(()=>{
        a.el.classList.add('matched'); bk.el.classList.add('matched');
        a.el.classList.remove('up'); bk.el.classList.remove('up');
        speak(a.c.speak);
        matched++; $('#mMatches').textContent=matched+'/'+total;
        flipped=[]; busy=false;
        if(matched===total) setTimeout(reviewThenWin,560);
      },260);
    } else {
      setTimeout(()=>{ a.el.classList.remove('up'); bk.el.classList.remove('up'); flipped=[]; busy=false; },760);
    }
  }
}

/* The board used to vanish 560ms after the last match — no time to see which phrase went
   with which meaning, which is the moment the learning lands. Hold it, and let the player
   move on when they are ready (or after a generous beat if they do nothing). */
function reviewThenWin(){
  if(document.getElementById('reviewBar')) return;
  const bar=document.createElement('div');
  bar.id='reviewBar'; bar.className='reviewbar';
  bar.innerHTML='<span>&#127881; All matched &mdash; take a look</span>'
              + '<button class="rbtn" id="seeResult">See how you did</button>';
  document.body.appendChild(bar);
  requestAnimationFrame(()=>bar.classList.add('show'));
  const go=()=>{ clearTimeout(t); bar.remove(); win(); };
  const t=setTimeout(go, 7000);
  bar.querySelector('#seeResult').onclick=go;
}

function win(){
  const name=(DATA.user||'').trim().split(/\s+/)[0];
  const head=name?('Brilliant, '+name+'!'):'Brilliant!';
  const line=keeper||'Every phrase matched. Beautiful work.';
  const grid=$('#grid'); if(grid) grid.style.display='none';
  const we=$('#winExtras');
  we.innerHTML='<div class="result-card">'+
    '<div class="rk">'+esc(head)+'</div>'+
    '<div class="rkeeper">'+esc(line)+'</div>'+
    '<div id="orivaHost"></div>'+
    '<div class="again"><button class="pri" id="againBtn">Play again</button>'+
    '<a class="sec" href="/arcade-type.html?type='+TYPE+'">More episodes</a></div></div>';
  try{
    if(window.ELC){
      ELC.markComplete(TYPE, EP);
      const host=document.getElementById('orivaHost');
      if(host) ELC.orivaCheer(host,'<b class="ohi">Oriva is proud of you!</b> Every phrase matched.');
    }
  }catch(e){}
  const ab=$('#againBtn'); if(ab) ab.onclick=()=>location.reload();
  try{ we.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){}
  if(!reduced) fireworks(2200);
}
function fireworks(ms){
  const cv=$('#fx'), ctx=cv.getContext('2d');
  function size(){cv.width=innerWidth;cv.height=innerHeight;} size();
  const onR=()=>size(); addEventListener('resize',onR); cv.classList.add('show');
  const cols=['#f6479a','#ff8a63','#8b6cff','#1fc4b6','#ffcd46','#57e6c4'];
  let parts=[], end=performance.now()+ms, last=0;
  function burst(x,y){ const c=cols[(Math.random()*cols.length)|0], n=34;
    for(let i=0;i<n;i++){ const a=(Math.PI*2*i)/n+Math.random()*0.2, sp=2+Math.random()*3.4;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.1,life:1,col:c}); } }
  function frame(now){ ctx.clearRect(0,0,cv.width,cv.height);
    if(now<end && now-last>330){ last=now; burst(cv.width*(0.2+Math.random()*0.6), cv.height*(0.16+Math.random()*0.3)); }
    for(const p of parts){ p.vy+=0.05; p.x+=p.vx; p.y+=p.vy; p.vx*=0.99; p.life-=0.012;
      ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,2.6,0,7); ctx.fill(); }
    ctx.globalAlpha=1; parts=parts.filter(p=>p.life>0);
    if(now<end||parts.length) requestAnimationFrame(frame);
    else { cv.classList.remove('show'); removeEventListener('resize',onR); }
  }
  requestAnimationFrame(frame);
}
function gate(title,msg,cta,how){
  $('#gateTitle').textContent=title;$('#gateMsg').textContent=msg;
  const b=$('#gateBtn'); if(cta){b.href=cta.href;b.textContent=cta.label;if(/^https?:/.test(cta.href)){b.target='_blank';b.rel='noopener';}}
  const hb=$('#gateHow'); if(hb){ if(how&&how.src){ hb.style.display='inline-flex'; hb.onclick=function(){ if(window.ELC) ELC.playVideo(how.src,how.title||'How to play',how.poster); }; } else hb.style.display='none'; }
  $('#gateview').classList.add('show');
}
/* The episode arrows. Neighbours WRAP (see api/games.js), so there is no end state to
   render — either both arrows exist or, for a one-episode game, neither does. */
function epPager(d){
  const el=$('#epPager'); if(!el) return;
  if(!d.prev && !d.next) return;
  const L='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
  const R='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  const arrow=(epi,dir)=>epi?`<a class="${dir<0?'p':'n'}" href="?ep=${encodeURIComponent(epi.id)}"`+
    ` rel="${dir<0?'prev':'next'}" aria-label="${dir<0?'Previous':'Next'} episode, ${esc(epi.ep)}">`+
    (dir<0?L:'')+`<b>${esc(epi.ep)}</b>`+(dir>0?R:'')+`</a>`:'';
  el.innerHTML=arrow(d.prev,-1)+arrow(d.next,1);
  el.hidden=false;
}

function acctBar(name, plan){
  /* the same avatar + card as every other page, not a bare Sign out button */
  ELCAccount(name ? { name: name, plan: plan } : null, { next: location.pathname + location.search });
}

async function load(){
  let res;
  try{ res=await fetch('/api/games?type='+encodeURIComponent(TYPE)+'&ep='+encodeURIComponent(EP)); }
  catch(e){ return gate('Connection problem','We couldn\u2019t reach the arcade. Check your connection and try again.'); }
  if(res.status===401){ let d={}; try{d=await res.json();}catch(e){} return gate('Members only','Sign in with Patreon from the Practice Arcade to play Phrase Pairs.',{href:'/practice-arcade.html',label:'Go to Practice Arcade'},{src:d.walkthrough,poster:d.walkthroughPoster,title:'Phrase Pairs \u2014 how to play'}); }
  if(res.status===403){
    let d={}; try{d=await res.json();}catch(e){}
    return gate('A Transcript-tier game', d.error||'Phrase Pairs is part of the Transcript tier ($1).',{href:CTA,label:'Unlock \u00b7 Transcript $1'},{src:d.walkthrough,poster:d.walkthroughPoster,title:'Phrase Pairs \u2014 how to play'});
  }
  if(!res.ok) return gate('Not available','This game isn\u2019t available right now. Please try again later.');
  const d=await res.json(); if(!d.ok||!d.content) return gate('Not available','This game isn\u2019t available right now.');
  DATA=Object.assign({user:d.user}, d.content);
  $('#epLabel').textContent=d.ep||EP.toUpperCase();
  /* the catalogue's glyph and accent, so the page wears the same identity as its tile */
  if(d.icon) $('#gameIcon').textContent=d.icon;
  epPager(d);
  acctBar(d.user, d.plan);
  try{ window.ELC&&ELC.recordPlay(); }catch(e){}
  try{ window.ELC&&d.walkthrough&&ELC.howToPlay(d.walkthrough,(d.name||"")+" \u2014 how to play",(d.walkthroughPoster||("/covers/"+TYPE+".png"))); }catch(e){}
  start(d.content);
}
$('#restart').addEventListener('click',()=>{ if(DATA) newGame(); });
load();
</script>
