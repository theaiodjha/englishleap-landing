<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listening Gap — English Leap Practice Arcade</title>
<meta name="theme-color" content="#1c0f0c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<style>
  :root{
    --space:#150b09; --ink:#fdf2ec; --soft:#cba99a;
    --pink:#f6479a; --coral:#ff8a63; --purple:#8b6cff; --teal:#1fc4b6; --mint:#57e6c4; --amber:#ffcd46;
    --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
    --display:'Clash Display',system-ui,sans-serif; --body:'General Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--body);color:var(--ink);background:var(--space);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  #stagebg{position:fixed;inset:0;z-index:-1;background:
    radial-gradient(110% 70% at 16% 4%, rgba(255,138,99,.22), transparent 56%),
    radial-gradient(90% 70% at 92% 2%, rgba(255,205,70,.18), transparent 58%),
    radial-gradient(90% 60% at 50% 108%, rgba(60,24,16,.5), transparent 70%),
    linear-gradient(180deg,#150b09 0%,#241310 52%,#2e1712 100%)}
  .wrap{max-width:820px;margin:0 auto;padding:14px 18px 60px;min-height:100%}
  .bar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 2px 14px}
  .bar .left{display:flex;align-items:center;gap:12px;min-width:0}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--soft);font-weight:600;font-size:14px;
    background:var(--glass);border:1px solid var(--line);padding:8px 13px;border-radius:999px;white-space:nowrap}
  .back:hover{color:var(--ink)}
  .brand{font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .dot{color:var(--coral)}
  .out{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--soft);font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border-radius:999px;cursor:pointer}
  .out:hover{color:var(--ink)}

  .head{text-align:center;margin:6px 0 14px}
  .ep{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--coral)}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,40px);margin:4px 0 8px;line-height:1.04}
  .sub{color:var(--soft);font-size:15px;max-width:34em;margin:0 auto;line-height:1.5}

  .prog{display:flex;gap:10px;justify-content:center;align-items:center;margin:14px 0 18px;flex-wrap:wrap}
  .pill{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-weight:600;font-size:14px;color:var(--soft)}
  .pill b{color:var(--ink);font-family:var(--display)}
  .dots{display:flex;gap:7px}
  .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18)}
  .dot.done{background:var(--coral)}
  .dot.cur{background:var(--amber);box-shadow:0 0 0 4px rgba(255,205,70,.18)}

  .card{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:24px;padding:30px 26px;backdrop-filter:blur(10px);
    box-shadow:0 30px 70px -30px rgba(0,0,0,.7);text-align:center;max-width:680px;margin:0 auto}
  .sentence{font-family:var(--display);font-weight:600;font-size:clamp(20px,4.6vw,30px);line-height:1.4}
  .gap{display:inline-block;min-width:130px;border-bottom:3px solid var(--coral);margin:0 4px;vertical-align:bottom;color:transparent}
  .gap.filled{border-bottom-color:transparent;color:#fff;border-radius:10px;padding:0 12px;font-weight:700}
  .play{appearance:none;border:0;cursor:pointer;margin-top:24px;display:inline-flex;align-items:center;gap:10px;
    font-family:var(--display);font-weight:700;font-size:17px;color:#3a1c12;padding:14px 26px;border-radius:999px;
    background:linear-gradient(135deg,var(--coral),var(--amber));box-shadow:0 16px 34px -14px rgba(255,138,99,.7)}
  .play:active{transform:translateY(1px)}
  .play .ic{font-size:18px}
  .replay{margin-top:12px;color:var(--soft);font-size:13px;background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  .bank{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:24px auto 0;max-width:680px}
  .chip{appearance:none;border:1px solid rgba(255,255,255,.32);cursor:pointer;font-family:var(--display);font-weight:700;
    font-size:clamp(15px,3.6vw,18px);padding:13px 20px;border-radius:16px;color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 22px -10px rgba(0,0,0,.5);transition:transform .12s,opacity .12s}
  .chip:hover{transform:translateY(-2px)}
  .chip.wrong{animation:shake .4s;opacity:.5;pointer-events:none}
  .chip.right{outline:3px solid #fff;outline-offset:2px}
  .chip:disabled{cursor:default}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .footer{margin-top:34px;text-align:center;color:var(--soft);font-size:12px;opacity:.8}

  .gateview{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(14,8,6,.88);backdrop-filter:blur(8px)}
  .gateview.show{display:flex}
  .gatecard{max-width:420px;text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:34px 28px;backdrop-filter:blur(12px)}
  .gatecard h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0 0 8px}
  .gatecard p{color:var(--soft);font-size:15px;line-height:1.55;margin:0 0 20px}
  .gatebtn{display:inline-block;text-decoration:none;color:#3a1c12;font-weight:700;font-size:15px;background:linear-gradient(135deg,var(--coral),var(--amber));padding:13px 22px;border-radius:999px}

  #fx{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;transition:opacity .3s}
  #fx.show{opacity:1}
  .nightbanner{position:fixed;left:50%;top:15%;transform:translate(-50%,-12px);z-index:55;text-align:center;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;max-width:92vw;padding:6px 22px}
  .nightbanner.show{opacity:1;transform:translate(-50%,0)}
  .nightbanner .big{font-family:var(--display);font-weight:700;font-size:clamp(26px,6.4vw,38px);line-height:1.05;
    background:linear-gradient(100deg,var(--amber),var(--coral),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 18px rgba(255,138,99,.4))}
  .nightbanner .small{color:var(--ink);font-size:15px;margin-top:8px;opacity:.95}
  .again{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:18px}
  .again a,.again button{font:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:11px 20px;cursor:pointer;text-decoration:none}
  .again .pri{background:linear-gradient(135deg,var(--coral),var(--amber));color:#3a1c12;border:0}
  .again .sec{background:var(--glass);border:1px solid var(--line);color:var(--ink)}
  @media(prefers-reduced-motion:reduce){.chip.wrong{animation:none}}
  .gatehow{margin-top:14px;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px}
  .gatehow:hover{border-color:rgba(255,255,255,.32)}
  .howbtn{align-items:center;justify-content:center;gap:8px;margin:14px auto 0;cursor:pointer;border:0;font:inherit;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;color:#10121c;background:#fff;box-shadow:0 10px 26px -10px rgba(0,0,0,.55)}
  .howbtn:hover{transform:translateY(-1px)}
  @media(max-width:380px){.wrap{padding:12px 12px 52px}.card{padding:22px 16px}.prog{gap:7px}}
</style>
<script src="/progress.js"></script>
</head>
<body>
<div id="stagebg"></div>
<div class="wrap">
  <div class="bar">
    <div class="left">
      <a class="back" href="/arcade-type.html?type=listening-gap" onclick="if(history.length>1){history.back();return false}">&#8592; Back</a>
      <div class="brand">English Leap<span class="dot">.</span> Practice Arcade</div>
    </div>
    <div id="acct"></div>
  </div>

  <div class="head">
    <div class="ep" id="epLabel">EP232</div>
    <h1>Listening Gap</h1>
  <button id="howBtn" class="howbtn" style="display:none">&#9654; How to play</button>
    <p class="sub" id="sub">Press play, listen, then tap the phrase that fits the gap.</p>
  </div>

  <div class="prog">
    <div class="pill">Round <b id="pRound">1/6</b></div>
    <div class="dots" id="dots"></div>
    <div class="pill">Score <b id="pScore">0</b></div>
  </div>

  <div id="game"></div>

  <div class="footer">A practice community - not a replacement for formal English education.</div>
</div>

<canvas id="fx"></canvas>
<div class="nightbanner" id="nightbanner"></div>

<div class="gateview" id="gateview">
  <div class="gatecard">
    <h2 id="gateTitle">Members only</h2>
    <p id="gateMsg"></p>
    <a class="gatebtn" id="gateBtn" href="/practice-arcade.html">Go to Practice Arcade</a>
    <button class="gatehow" id="gateHow" style="display:none">&#9654; How to play</button>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const CTA='https://www.patreon.com/c/englishleappracticeclub/membership';
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const EP=new URLSearchParams(location.search).get('ep')||'ep232';
const TYPE='listening-gap';
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function textOn(hex){const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return (0.2126*r+0.7152*g+0.0722*b)/255>0.62?'#0f2230':'#ffffff';}

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
loadVoices(); if(typeof speechSynthesis!=='undefined'&&speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=loadVoices;
function pickVoice(){return voices.find(v=>/en-GB/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||voices[0];}
function speak(t){try{if(typeof speechSynthesis==='undefined')return;const u=new SpeechSynthesisUtterance(t);const v=pickVoice();if(v)u.voice=v;u.lang=(v&&v.lang)||'en-GB';u.rate=.92;speechSynthesis.cancel();speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){}}

let DATA=null, rounds=[], idx=0, score=0, bank=[], answered=false, perfect=true, keeper='';
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function gapHTML(text,phrase){
  const i=text.toLowerCase().indexOf(phrase.toLowerCase());
  if(i<0) return esc(text)+' <span class="gap">\u2003\u2003</span>';
  return esc(text.slice(0,i))+'<span class="gap" id="theGap">\u2003\u2003\u2003</span>'+esc(text.slice(i+phrase.length));
}
function renderRound(){
  const r=rounds[idx]; answered=false; perfect=true;
  $('#pRound').textContent=(idx+1)+'/'+rounds.length;
  // dots
  $('#dots').innerHTML=rounds.map((_,k)=>`<span class="dot ${k<idx?'done':''} ${k===idx?'cur':''}"></span>`).join('');
  bank=shuffle(rounds.map(x=>x.phrase));
  $('#game').innerHTML=`
    <div class="card">
      <div class="sentence" id="sentence">${gapHTML(r.text,r.phrase)}</div>
      <div><button class="play" id="playBtn"><span class="ic">&#9654;</span> Hear the sentence</button></div>
      <div><button class="replay" id="replayBtn">Play again</button></div>
    </div>
    <div class="bank" id="bank">${bank.map(w=>{const c=byPhrase[w];return `<button class="chip" data-w="${esc(w)}" style="background:${c};color:${textOn(c)}">${esc(w)}</button>`;}).join('')}</div>`;
  $('#playBtn').onclick=()=>speak(r.text);
  $('#replayBtn').onclick=()=>speak(r.text);
  $('#bank').querySelectorAll('.chip').forEach(b=>b.onclick=()=>pick(b));
  // auto-play after first user gesture (speech is unlocked once they've started)
  if(started) setTimeout(()=>speak(r.text),260);
}
let started=false, byPhrase={};
function pick(btn){
  if(answered) return;
  started=true;
  const w=btn.dataset.w, r=rounds[idx];
  if(w===r.phrase){
    answered=true;
    btn.classList.add('right');
    const gap=$('#theGap'); if(gap){gap.classList.add('filled');gap.style.background=r.color;gap.style.color=textOn(r.color);gap.textContent=r.phrase;}
    if(perfect) score++; $('#pScore').textContent=score;
    $('#bank').querySelectorAll('.chip').forEach(c=>c.disabled=true);
    setTimeout(()=>{ idx++; if(idx>=rounds.length) win(); else renderRound(); }, reduced?500:1050);
  } else {
    perfect=false; btn.classList.add('wrong'); btn.disabled=true;
  }
}
function win(){
  const name=(DATA.user||'').trim().split(/\s+/)[0];
  const head=name?('Great listening, '+name+'!'):'Great listening!';
  const sc=`You scored ${score}/${rounds.length} on the first try.`;
  $('#game').innerHTML=`<div class="card">
    <div class="sentence">${esc(sc)}</div>
    <div style="color:var(--soft);margin-top:12px;font-size:15px">${esc(keeper||'')}</div>
    <div id="winExtras"></div>
    <div class="again"><button class="pri" id="againBtn">Play again</button><a class="sec" href="/arcade-type.html?type=${TYPE}">More episodes</a></div>
  </div>`;
  $('#dots').innerHTML=rounds.map(()=>'<span class="dot done"></span>').join('');
  $('#againBtn').onclick=()=>{idx=0;score=0;$('#pScore').textContent='0';renderRound();};
  try{
    if(window.ELC){
      ELC.markComplete(TYPE, EP);
      const host=$('#winExtras'); if(host){
        const phrase=rounds.length?rounds[Math.floor(Math.random()*rounds.length)].phrase:'';
        const epl=$('#epLabel').textContent||EP.toUpperCase();
        ELC.orivaCheer(host,'<b style="color:#ff8a63">Oriva heard that!</b> Great listening.');
      }
    }
  }catch(e){}
  const nb=$('#nightbanner');
  nb.innerHTML='<div class="big">'+esc(head)+'</div><div class="small">'+esc(keeper||'Beautiful work.')+'</div>';
  nb.classList.add('show'); setTimeout(()=>nb.classList.remove('show'),3200);
  if(!reduced) fireworks(2200);
}
function fireworks(ms){
  const cv=$('#fx'),ctx=cv.getContext('2d');
  function size(){cv.width=innerWidth;cv.height=innerHeight;}size();
  const onR=()=>size();addEventListener('resize',onR);cv.classList.add('show');
  const cols=['#f6479a','#ff8a63','#8b6cff','#1fc4b6','#ffcd46','#57e6c4'];
  let parts=[],end=performance.now()+ms,last=0;
  function burst(x,y){const c=cols[(Math.random()*cols.length)|0],n=34;for(let i=0;i<n;i++){const a=(Math.PI*2*i)/n+Math.random()*0.2,sp=2+Math.random()*3.4;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.1,life:1,col:c});}}
  function frame(now){ctx.clearRect(0,0,cv.width,cv.height);
    if(now<end&&now-last>330){last=now;burst(cv.width*(0.2+Math.random()*0.6),cv.height*(0.16+Math.random()*0.3));}
    for(const p of parts){p.vy+=0.05;p.x+=p.vx;p.y+=p.vy;p.vx*=0.99;p.life-=0.012;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,7);ctx.fill();}
    ctx.globalAlpha=1;parts=parts.filter(p=>p.life>0);
    if(now<end||parts.length)requestAnimationFrame(frame);else{cv.classList.remove('show');removeEventListener('resize',onR);}}
  requestAnimationFrame(frame);
}
function gate(title,msg,cta,how){
  $('#gateTitle').textContent=title;$('#gateMsg').textContent=msg;
  const b=$('#gateBtn'); if(cta){b.href=cta.href;b.textContent=cta.label;if(/^https?:/.test(cta.href)){b.target='_blank';b.rel='noopener';}}
  const hb=$('#gateHow'); if(hb){ if(how&&how.src){ hb.style.display='inline-flex'; hb.onclick=function(){ if(window.ELC) ELC.playVideo(how.src,how.title||'How to play',how.poster); }; } else hb.style.display='none'; }
  $('#gateview').classList.add('show');
}
function acctBar(name){
  const acct=$('#acct');
  if(name){acct.innerHTML=`<button class="out" id="signoutMenu">Sign out</button>`;$('#signoutMenu').onclick=async()=>{try{await fetch('/api/auth/signout',{method:'POST'});}catch(e){}location.href='/practice-arcade.html';};}
  else acct.innerHTML='';
}
async function load(){
  let res;
  try{res=await fetch('/api/games?type='+encodeURIComponent(TYPE)+'&ep='+encodeURIComponent(EP));}
  catch(e){return gate('Connection problem','We couldn\u2019t reach the arcade. Check your connection and try again.');}
  if(res.status===401){let d={};try{d=await res.json();}catch(e){} return gate('Members only','Sign in with Patreon from the Practice Arcade to play Listening Gap.',{href:'/practice-arcade.html',label:'Go to Practice Arcade'},{src:d.walkthrough,poster:d.walkthroughPoster,title:'Listening Gap \u2014 how to play'});}
  if(res.status===403){let d={};try{d=await res.json();}catch(e){}return gate('A Fluency Club game', d.error||'Listening Gap is part of Fluency Club ($2.99).',{href:CTA,label:'Unlock \u00b7 Fluency $2.99'},{src:d.walkthrough,poster:d.walkthroughPoster,title:'Listening Gap \u2014 how to play'});}
  if(!res.ok) return gate('Not available','This game isn\u2019t available right now. Please try again later.');
  const d=await res.json(); if(!d.ok||!d.content) return gate('Not available','This game isn\u2019t available right now.');
  DATA=Object.assign({user:d.user}, d.content);
  rounds=d.content.rounds||[]; keeper=d.content.keeper||'';
  byPhrase={}; rounds.forEach(r=>byPhrase[r.phrase]=r.color);
  $('#epLabel').textContent=d.ep||EP.toUpperCase();
  if(d.content.intro) $('#sub').textContent=d.content.intro;
  acctBar(d.user);
  try{ window.ELC&&ELC.recordPlay(); }catch(e){}
  try{ window.ELC&&d.walkthrough&&ELC.howToPlay(d.walkthrough,(d.name||"")+" \u2014 how to play",(d.walkthroughPoster||("/covers/"+TYPE+".png"))); }catch(e){}
  idx=0; score=0; $('#pScore').textContent='0';
  renderRound();
}
load();
</script>
</body>
</html>
