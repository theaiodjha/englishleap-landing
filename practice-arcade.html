<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Leap Club &middot; Practice Arcade</title>
<script src="/theme.js"></script>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  :root{--space:#0a0a14;--ink:#eef0fb;--soft:#a6a6c4;--pink:#f6479a;--coral:#ff8a63;--purple:#8b6cff;--teal:#1fc4b6;
    --practise:#8b6cff;--use:#1fc4b6;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);
    --display:'Clash Display',system-ui,sans-serif;--body:'General Sans',system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:var(--body);color:var(--ink);background:var(--space);overflow-x:hidden}
  .aurora{position:fixed;inset:-30%;z-index:0;filter:blur(80px);opacity:.5;pointer-events:none}
  .aurora b{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 22s ease-in-out infinite}
  .a1{width:46vw;height:46vw;background:var(--purple);top:-6%;left:-4%}
  .a2{width:40vw;height:40vw;background:var(--teal);bottom:-10%;right:-6%;animation-delay:-7s}
  .a3{width:34vw;height:34vw;background:var(--coral);top:30%;right:25%;animation-delay:-14s}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,6%) scale(1.12)}}
  .wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:22px 22px 110px}

  /* top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:34px}
  .brandmini{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;letter-spacing:.01em}
  .brandmini .dotm{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 6px 16px -5px var(--purple)}
  .acct{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--soft);min-height:38px}
  .acct .out{font-family:inherit;font-weight:600;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--line);
    border-radius:999px;padding:9px 17px;cursor:pointer;transition:.15s;backdrop-filter:blur(10px)}
  .acct .out:hover{border-color:var(--teal);transform:translateY(-1px)}

  header{text-align:center;margin-bottom:8px}
  .brand{font-weight:600;letter-spacing:.22em;font-size:13px;color:var(--teal)}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,56px);margin:6px 0 4px;
    background:linear-gradient(100deg,var(--pink),var(--coral) 55%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--soft);font-size:16px}

  /* modern segmented switcher */
  .tabs{display:inline-flex;gap:4px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(12px);margin:20px auto 0;box-shadow:0 10px 30px -16px rgba(0,0,0,.6)}
  .tabs a{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-family:var(--display);
    font-weight:600;font-size:14px;color:var(--soft);text-decoration:none;transition:.2s}
  .tabs a:hover{color:var(--ink)}
  .tabs a.active{background:linear-gradient(100deg,var(--teal),var(--coral));color:#06121f;box-shadow:0 8px 20px -8px rgba(31,196,182,.6)}

  /* gate (anonymous) */
  .gate{max-width:460px;margin:34px auto 0;background:var(--glass);border:1px solid var(--line);border-radius:22px;
    padding:32px 30px;backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center}
  .gate h2{font-family:var(--display);font-weight:600;font-size:23px;margin:0 0 8px}
  .gate p{color:var(--soft);font-size:14px;margin:0 0 22px;line-height:1.5}
  .patreon{display:inline-flex;align-items:center;gap:10px;width:100%;justify-content:center;font-weight:600;font-size:15px;
    border:none;border-radius:13px;padding:15px 20px;cursor:pointer;color:#06121f;text-decoration:none;
    background:linear-gradient(100deg,var(--teal),var(--coral));transition:transform .12s,filter .12s}
  .patreon:hover{transform:translateY(-1px);filter:brightness(1.06)}
  .alt{margin-top:16px;font-size:13px;color:var(--soft);cursor:pointer;text-decoration:underline}
  .codebox{display:none;margin-top:16px}
  .field{display:flex;gap:10px}
  input{flex:1;font-family:inherit;font-size:15px;letter-spacing:.14em;text-transform:uppercase;background:rgba(0,0,0,.35);
    border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:13px 14px;outline:none}
  input:focus{border-color:var(--teal)}
  .codebox button{font-family:inherit;font-weight:600;border:none;border-radius:11px;padding:13px 18px;cursor:pointer;color:#06121f;background:var(--purple)}
  .msg{margin-top:14px;font-size:14px;min-height:18px}.msg.err{color:var(--coral)}.msg.ok{color:var(--teal)}

  #arcade{display:none;margin-top:30px}
  .banner{max-width:780px;margin:0 auto 24px;background:rgba(255,138,99,.12);border:1px solid rgba(255,138,99,.4);
    border-radius:14px;padding:14px 18px;font-size:14px;line-height:1.5;text-align:center}
  .banner b{color:var(--coral)}
  .gtype{margin-top:0;margin-bottom:52px}
  .gtype:last-child{margin-bottom:24px}
  .gtype-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .viewall{margin-left:auto;flex:0 0 auto;text-decoration:none;color:var(--teal);font-weight:700;font-size:13.5px;
    background:var(--glass);border:1px solid var(--line);padding:8px 14px;border-radius:999px;white-space:nowrap}
  .viewall:hover{border-color:rgba(255,255,255,.3)}
  .gicon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--purple),var(--teal));box-shadow:0 10px 26px -8px rgba(139,108,255,.6)}
  .gtype-head .gt-name{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05}
  .gtype-head .gt-tag{color:var(--soft);font-size:13.5px;margin-top:2px}
  .deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .tile{display:block;text-decoration:none;color:var(--ink);background:var(--glass);border:1px solid var(--line);
    border-radius:20px;overflow:hidden;backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.4);transition:transform .15s,border-color .15s}
  .tile:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.24)}
  .cover{position:relative;aspect-ratio:16/9;background:linear-gradient(120deg,#1a1430,#241a3e);overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;
    font-family:var(--display);font-weight:700;font-size:20px;color:#fff;background:linear-gradient(120deg,var(--purple),var(--teal))}
  .now{position:absolute;top:11px;left:11px;font-size:11px;font-weight:700;color:#06121f;background:var(--teal);border-radius:30px;padding:4px 11px;letter-spacing:.04em}
  .tile .body{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .tile .ep{font-family:var(--display);font-weight:700;font-size:13px;color:var(--teal);letter-spacing:.04em}
  .tile .ttl{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.15;margin-top:2px}
  .tile .play{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--coral),var(--pink))}
  .tile.locked .cover{filter:saturate(.55) brightness(.62)}
  .tile.locked:hover{transform:translateY(-3px)}
  .lockbadge{position:absolute;top:10px;right:11px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(8,6,20,.6);color:#fff;font-size:14px;backdrop-filter:blur(4px)}
  .tile .unlock{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--glass);border:1px solid var(--line);padding:8px 13px;border-radius:999px;white-space:nowrap}
  .gt-name .ribbon{font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
  .ribbon.free{background:rgba(31,196,182,.16);color:#13978d}
  .ribbon.transcript{background:rgba(139,108,255,.18);color:#6f54e6}
  .ribbon.fluency{background:rgba(255,205,70,.20);color:#b07d05}

  /* upgrade banner — full width, aligned with the games */
  .upsell{display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;margin-top:34px;
    background:linear-gradient(120deg,rgba(139,108,255,.18),rgba(31,196,182,.13));border:1px solid var(--line);
    border-radius:22px;padding:24px 28px;backdrop-filter:blur(12px);box-shadow:0 24px 60px -34px rgba(0,0,0,.6)}
  .upsell .ut{flex:1 1 320px;min-width:260px}
  .upsell .ut h3{font-family:var(--display);font-weight:700;font-size:21px;margin:0 0 6px}
  .upsell .ut p{color:var(--soft);font-size:14px;margin:0;line-height:1.5}
  .upsell .patreon{width:auto;flex:0 0 auto;white-space:nowrap;padding:14px 24px}

  /* compact sign-in strip */
  .signin{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:34px;backdrop-filter:blur(12px)}
  .signin .si-main{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:space-between}
  .signin .si-text{flex:1 1 280px;color:var(--soft);font-size:14.5px;line-height:1.5}
  .signin .si-text b{color:var(--ink)}
  .signin .si-btn{flex:0 0 auto;text-decoration:none;color:#06121f;font-weight:700;font-size:15px;white-space:nowrap;
    background:linear-gradient(135deg,var(--teal),var(--coral));padding:12px 20px;border-radius:999px}
  .signin .si-foot{margin-top:10px}
  .signin .alt{color:var(--soft);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .signin .codebox{display:none;margin-top:12px}
  .signin .field{display:flex;gap:8px;max-width:360px}
  .signin .field input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink);font:inherit}
  .signin .field button{border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--teal);color:#062018}
  .signin .msg{margin-top:10px;font-size:13px}
  .signin .msg.err{color:#ff9a9a}.signin .msg.ok{color:var(--teal)}

  /* game-type tiles (poster style) */
  .types{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
  .gtile{position:relative;display:block;border-radius:22px;overflow:hidden;aspect-ratio:16/10;text-decoration:none;color:#fff;
    border:1px solid var(--line);box-shadow:0 26px 60px -24px rgba(0,0,0,.65);transition:transform .16s,border-color .16s}
  .gtile:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.3)}
  .gcover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .gtile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(6,8,16,.94) 4%,rgba(6,8,16,.45) 40%,transparent 68%)}
  .gtile.locked .gcover{filter:saturate(.6) brightness(.66)}
  .gribbon{position:absolute;top:13px;left:13px;z-index:2;font-size:11px;font-weight:800;letter-spacing:.04em;padding:4px 11px;border-radius:999px}
  .gribbon.free{background:rgba(31,196,182,.92);color:#062018}
  .gribbon.transcript{background:rgba(139,108,255,.94);color:#0d0a26}
  .gribbon.fluency{background:rgba(255,205,70,.94);color:#231a02}
  .glock{position:absolute;top:12px;right:13px;z-index:2;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;
    background:rgba(8,6,20,.6);color:#fff;font-size:15px;backdrop-filter:blur(4px)}
  .gov{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .gname{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.05}
  .gcount{margin-top:5px;color:rgba(255,255,255,.84);font-weight:600;font-size:14px}
  .gplay{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:#06121f;
    background:linear-gradient(135deg,var(--teal),var(--coral))}

  footer{text-align:center;color:var(--soft);font-size:12px;margin-top:54px}
</style>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0a14">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English Leap">
<script src="/pwa.js" defer></script>
</head>
<body>
<div class="aurora"><b class="a1"></b><b class="a2"></b><b class="a3"></b></div>
<div class="wrap">
  <div class="topbar">
    <a class="brandmini" href="/"><span class="dotm"></span> English Leap Club</a>
    <div class="acct" id="acct"></div>
  </div>

  <header>
    <h1>Practice Arcade</h1>
    <div class="sub">Play the phrases &mdash; one game per episode.</div>
  </header>

  <section class="signin" id="gate">
    <div class="si-main">
      <div class="si-text"><b>The Clue Room is free</b> &mdash; no account needed. Sign in with Patreon to unlock more games.</div>
      <a class="si-btn" href="/api/auth/login">&#9654;&nbsp; Continue with Patreon</a>
    </div>
    <div class="si-foot"><span class="alt" id="altToggle">Have a member code?</span></div>
    <div class="codebox" id="codebox">
      <div class="field"><input id="code" placeholder="ELC-XXXX-XXXX" autocomplete="off" spellcheck="false"><button id="go">Unlock</button></div>
    </div>
    <div class="msg" id="msg"></div>
  </section>

  <section id="arcade"></section>
  <footer>&copy; Leap Labs &middot; A practice community - not a replacement for formal English education.</footer>
</div>

<script>
const $=s=>document.querySelector(s);
const CTA='https://www.patreon.com/c/englishleappracticeclub/membership';
const ERR={auth:'Sign-in did not complete. Please try again.',notmember:'We could not find an active membership for that Patreon account.'};
function showMsg(t,kind){const m=$('#msg');m.className='msg '+(kind||'');m.textContent=t||'';}
const eParam=new URLSearchParams(location.search).get('e'); if(eParam&&ERR[eParam]) showMsg(ERR[eParam],'err');
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function tryLoad(){
  const r=await fetch('/api/games'); if(!r.ok) return false;
  const data=await r.json(); if(!data.ok) return false; render(data); return true;
}
const RIB={free:'Free',transcript:'Transcript \u00b7 $1',fluency:'Fluency \u00b7 $2.99'};
function typeTile(gt){
  const n=(gt.episodes||[]).length;
  const cnt=n+' '+(n===1?'episode':'episodes');
  const cover=`/covers/${esc(gt.type)}.png`;
  return `<a class="gtile ${gt.locked?'locked':''}" href="/arcade-type.html?type=${esc(gt.type)}">
    <img class="gcover" src="${cover}" alt="${esc(gt.name)}" onerror="this.style.display='none'">
    <span class="gribbon ${esc(gt.access||'')}">${RIB[gt.access]||''}</span>
    ${gt.locked?'<span class="glock">&#128274;</span>':''}
    <div class="gov">
      <div><div class="gname">${esc(gt.name)}</div><div class="gcount">${cnt}</div></div>
      ${gt.locked?'':'<span class="gplay">&#9654;</span>'}
    </div></a>`;
}
function render(data){
  const signedIn=!!data.name;
  const root=$('#arcade'); root.style.display='block';
  const acct=$('#acct');
  if(signedIn){
    $('#gate').style.display='none';
    acct.innerHTML=`Signed in as <b style="color:var(--ink);font-weight:600">${esc(data.name)}</b> <button class="out" id="signoutBtn">Sign out</button>`;
    $('#signoutBtn').onclick=async()=>{await fetch('/api/auth/signout',{method:'POST'});location.href='/practice-arcade.html';};
  } else {
    acct.innerHTML=''; $('#gate').style.display='block';
  }

  const types=(data.arcade||[]);
  let html=`<div class="types">${types.map(typeTile).join('')}</div>`;

  const lockedTiers=[...new Set(types.filter(g=>g.locked).map(g=>g.access))];
  if(lockedTiers.length){
    const wantFluency=lockedTiers.includes('fluency');
    const copy = data.level==='transcript'
      ? 'You have the <b>Transcript</b> tier. <b>Fluency Club ($2.99)</b> opens every game.'
      : '<b>Transcript ($1)</b> adds Phrase Pairs; <b>Fluency Club ($2.99)</b> opens everything.';
    html+=`<div class="upsell">
      <div class="ut"><h3>Unlock more games</h3><p>${copy}</p></div>
      <a class="patreon" href="${CTA}" target="_blank" rel="noopener">${wantFluency?'Join Fluency Club &middot; $2.99':'Join &middot; $1'}</a></div>`;
  }
  root.innerHTML=html;
}
$('#altToggle').addEventListener('click',()=>{const b=$('#codebox');b.style.display=b.style.display==='block'?'none':'block';});
async function unlock(){
  const code=$('#code').value.trim(); if(!code){showMsg('Please enter your code.','err');return;}
  $('#go').disabled=true;
  try{
    const r=await fetch('/api/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
    const d=await r.json();
    if(!r.ok||!d.ok){showMsg(d.error||'That code did not work.','err');$('#go').disabled=false;return;}
    showMsg('Unlocked. Loading...','ok'); await tryLoad();
  }catch{showMsg('Something went wrong. Try again.','err');$('#go').disabled=false;}
}
$('#go').addEventListener('click',unlock);
$('#code').addEventListener('keydown',ev=>{if(ev.key==='Enter')unlock();});
tryLoad();
</script>
</body>
</html>
